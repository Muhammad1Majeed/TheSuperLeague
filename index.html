<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كأس العالم - World Cup 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root {
            --bg-dark: #1a050c;
            --surface-color: rgba(45, 10, 22, 0.85);
            --primary-glow: #d4af37; 
            --admin-gold: #ffd700;
            --text-main: #fcf8f2;
            --text-muted: #bda6aa;
            --danger: #ff3366;
            --success: #00e676;
            --border-light: rgba(212, 175, 55, 0.15);
            --card-shadow: 0 10px 40px 0 rgba(0, 0, 0, 0.6);
            --gold-box-shadow: 0 0 15px rgba(212, 175, 55, 0.2), inset 0 0 20px rgba(212, 175, 55, 0.05);
        }

        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(212, 175, 55, 0.05), transparent 40%),
                radial-gradient(circle at 85% 30%, rgba(212, 175, 55, 0.08), transparent 40%),
                url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCI+CjxwYXRoIGQ9Ik0yMCAwbDIwIDIwLTIwIDIwTDAgMjB6IiBmaWxsPSJyZ2JhKDIxMiwgMTc1LCA1NSwgMC4wMSkiIGZpbGwtcnVsZT0iZXZlbm9kZCIvPgo8L3N2Zz4=');
            color: var(--text-main); min-height: 100vh; padding-bottom: 60px; background-attachment: fixed; overflow-x: hidden;
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: rgba(212, 175, 55, 0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary-glow); }

        .glass-panel {
            background: var(--surface-color); backdrop-filter: blur(25px);
            border: 1px solid var(--border-light); border-left: 3px solid var(--primary-glow);
            border-radius: 16px; padding: 25px; margin-bottom: 25px; box-shadow: var(--card-shadow);
            transition: transform 0.3s ease;
        }
        
        #login-screen { padding: 60px 20px; max-width: 1100px; margin: auto; text-align: center; animation: fadeIn 1s ease; }
        
        .main-title {
            font-size: 3.5rem; font-weight: 900; background: linear-gradient(to bottom, #fff, var(--primary-glow));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 5px;
            letter-spacing: 2px; text-shadow: 0 5px 30px rgba(212, 175, 55, 0.4);
        }

        .subtitle { color: var(--primary-glow); font-size: 1.2rem; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; }
        .players-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; margin-top: 50px; }

        .player-card {
            background: linear-gradient(145deg, rgba(30, 8, 15, 0.9), rgba(45, 10, 22, 0.9));
            border: 1px solid var(--border-light); border-radius: 16px; padding: 20px 15px;
            cursor: pointer; transition: all 0.4s ease; position: relative; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .player-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px;
            background: linear-gradient(90deg, transparent, var(--primary-glow), transparent);
            transform: scaleX(0); transition: 0.4s;
        }
        .player-card:hover {
            transform: translateY(-8px); border-color: rgba(212, 175, 55, 0.5);
            background: rgba(55, 15, 28, 0.95); box-shadow: 0 15px 30px -10px rgba(212, 175, 55, 0.3);
        }
        .player-card:hover::before { transform: scaleX(1); }

        .player-logo {
            width: 70px; height: 70px; object-fit: cover; border-radius: 50%;
            border: 2px solid rgba(212, 175, 55, 0.3); margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5); transition: 0.4s ease; background: #fff;
        }
        .player-card:hover .player-logo { transform: scale(1.1); border-color: var(--primary-glow); }
        .player-card .name { font-weight: 800; font-size: 1.1rem; margin-bottom: 4px; color: #fff; }
        .player-card .team-name { font-size: 0.9rem; color: var(--primary-glow); font-weight: 700; }
        .admin-badge { background: rgba(255, 215, 0, 0.1); color: var(--admin-gold); border: 1px solid rgba(255, 215, 0, 0.4); font-size: 0.75rem; font-weight: 700; padding: 5px 15px; border-radius: 20px; margin-top: 15px; display: inline-block; }

        /* Navigation */
        .top-nav {
            background: rgba(26, 5, 12, 0.95); backdrop-filter: blur(20px); padding: 15px 30px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border-light); position: sticky; top: 0; z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        .brand-text { font-size: 1.4rem; font-weight: 900; color: var(--primary-glow); margin-left: 20px; border-left: 1px solid var(--border-light); padding-left: 20px; }
        .user-profile { display: flex; align-items: center; gap: 15px; }
        .user-profile img { width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--primary-glow); }
        .logout-btn { background: transparent; border: 1px solid rgba(255,51,102,0.4); color: var(--danger); padding: 8px 20px; border-radius: 6px; cursor: pointer; font-weight: 700; transition: 0.3s; }
        .logout-btn:hover { background: rgba(255, 51, 102, 0.15); }

        /* Tabs */
        .tabs-container { display: flex; gap: 10px; padding: 25px 20px; max-width: 1200px; margin: auto; overflow-x: auto; }
        .tab-btn { background: rgba(0,0,0,0.2); color: var(--text-muted); border: 1px solid var(--border-light); border-radius: 8px; padding: 12px 20px; cursor: pointer; font-weight: 700; font-size: 0.9rem; transition: 0.3s; white-space: nowrap; }
        .tab-btn:hover { background: rgba(212,175,55,0.1); color: #fff; }
        .tab-btn.active { background: rgba(212,175,55,0.15); color: var(--primary-glow); border-color: var(--primary-glow); box-shadow: 0 0 15px rgba(212, 175, 55, 0.2); }

        .view-section { display: none; max-width: 1200px; margin: auto; padding: 0 20px; }
        .view-section.active { display: block; animation: slideUp 0.5s ease forwards; }

        /* Tables */
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: separate; border-spacing: 0 6px; text-align: center; }
        th { color: var(--primary-glow); padding: 12px; font-weight: 800; font-size: 0.85rem; border-bottom: 1px solid var(--border-light); }
        tbody tr { background: rgba(30, 8, 15, 0.6); transition: 0.3s; }
        tbody tr:hover { background: rgba(45, 10, 22, 0.9); transform: scale(1.01); }
        td { padding: 12px; font-weight: 700; font-size: 0.95rem; }
        tbody tr td:first-child { border-right: 3px solid transparent; border-radius: 0 8px 8px 0; }
        tbody tr td:last-child { border-radius: 8px 0 0 8px; }
        tbody tr:hover td:first-child { border-right: 3px solid var(--primary-glow); }
        .team-info { display: flex; align-items: center; gap: 12px; text-align: right; }
        .team-info img { width: 35px; height: 35px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.1); }
        .pts-col { color: var(--primary-glow); font-weight: 900; font-size: 1.1rem; }
        .status-badge { padding: 5px 12px; border-radius: 20px; font-size: 0.7rem; font-weight: 800; }
        .badge-qual { background: rgba(212, 175, 55, 0.1); color: var(--primary-glow); border: 1px solid rgba(212, 175, 55, 0.3); }
        .badge-out { background: rgba(255, 51, 102, 0.1); color: var(--danger); border: 1px solid rgba(255, 51, 102, 0.2); }
        .group-title { color: #fff; font-size: 1.2rem; font-weight: 900; margin: 30px 0 10px 0; border-bottom: 1px solid var(--primary-glow); display: inline-block; padding-bottom: 5px; }

        .section-title { color: #fff; font-weight: 900; font-size: 1.5rem; margin-bottom: 25px; display: flex; align-items: center; gap: 12px; }
        .section-title::before { content: ''; display: block; width: 5px; height: 25px; background: var(--primary-glow); border-radius: 4px; }
        
        .qualified-boundary td { border-bottom: 2px dashed rgba(212, 175, 55, 0.3); }

        /* Matches UI */
        .match-card { background: rgba(30, 8, 15, 0.7); border: 1px solid var(--border-light); border-radius: 12px; padding: 20px; margin-bottom: 15px; transition: 0.3s; }
        .match-card:hover { background: rgba(45, 10, 22, 0.9); border-color: rgba(212, 175, 55, 0.4); }
        .teams-row { display: flex; justify-content: space-between; align-items: center; }
        .team { display: flex; flex-direction: column; align-items: center; width: 30%; gap: 10px; font-weight: 800; text-align: center; }
        .team img { width: 60px; height: 60px; border-radius: 50%; border: 2px solid var(--border-light); }
        .score-area { display: flex; flex-direction: column; align-items: center; width: 40%; }
        .score-box { font-size: 2rem; font-weight: 900; color: #fff; letter-spacing: 5px; }
        
        /* Knockout Bracket Tree */
        .bracket-wrapper { overflow-x: auto; padding: 20px 0; margin-top: 20px; }
        .bracket-container { display: flex; justify-content: center; min-width: 1100px; gap: 15px; }
        .bracket-column { display: flex; flex-direction: column; justify-content: space-around; gap: 15px; width: 170px; }
        .bracket-column.center { width: 220px; align-items: center; }
        
        .bracket-node {
            background: rgba(20, 5, 10, 0.9); border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 8px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: 0.3s; position: relative;
        }
        .bracket-node:hover { border-color: var(--primary-glow); box-shadow: 0 0 15px rgba(212, 175, 55, 0.4); transform: scale(1.02); }
        .match-label { font-size: 0.65rem; text-align: center; background: rgba(0,0,0,0.6); padding: 4px; color: var(--primary-glow); font-weight: 800; }
        .bracket-team { display: flex; align-items: center; padding: 6px 10px; gap: 8px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .bracket-team img { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border-light); }
        .bracket-team .t-name { flex-grow: 1; font-size: 0.75rem; font-weight: 800; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; }
        .bracket-team .t-score { font-weight: 900; color: var(--primary-glow); font-size: 0.9rem; }
        .pen-score { font-size: 0.65rem; color: var(--success); margin-right: 5px; }
        .tba-text { color: var(--text-muted) !important; font-style: italic; font-weight: normal !important; }

        .trophy-container { text-align: center; margin-bottom: 15px; animation: float 3s ease-in-out infinite; }
        .trophy-container img { width: 80px; filter: drop-shadow(0 10px 15px rgba(212, 175, 55, 0.5)); }

        /* Admin Controls */
        .score-input { width: 50px; height: 45px; text-align: center; background: rgba(0,0,0,0.6); border: 1px solid var(--border-light); color: var(--primary-glow); font-size: 1.2rem; font-weight: 900; border-radius: 6px; font-family: 'Segoe UI', sans-serif; }
        .score-input:focus { outline: none; border-color: var(--primary-glow); box-shadow: inset 0 0 10px rgba(212,175,55,0.2); }
        .pen-input { width: 40px; height: 35px; font-size: 0.9rem; color: #fff; }
        select.modern-select { width: 100%; padding: 15px; background: rgba(26,5,12,0.9); color: #fff; border: 1px solid var(--border-light); border-radius: 8px; margin-bottom: 20px; font-size: 1rem; font-weight: 700; outline: none; }
        .btn-primary { background: linear-gradient(45deg, rgba(212,175,55,0.1), rgba(212,175,55,0.2)); color: var(--primary-glow); border: 1px solid var(--primary-glow); padding: 15px 30px; border-radius: 8px; font-weight: 800; width: 100%; cursor: pointer; transition: 0.3s; }
        .btn-primary:hover { background: var(--primary-glow); color: #000; box-shadow: 0 0 20px rgba(212, 175, 55, 0.5); }
        .btn-danger { background: rgba(255,51,102,0.1); color: var(--danger); border-color: var(--danger); }
        .btn-danger:hover { background: var(--danger); color: #fff; box-shadow: 0 0 20px rgba(255, 51, 102, 0.5); }

        .system-status { position: fixed; bottom: 20px; left: 20px; background: rgba(26,5,12,0.9); border: 1px solid var(--border-light); padding: 10px 20px; border-radius: 30px; font-size: 0.75rem; font-weight: 800; display: flex; align-items: center; gap: 10px; z-index: 1000; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; }
        .dot-live { background: var(--success); box-shadow: 0 0 10px var(--success); animation: pulse 2s infinite; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(0, 230, 118, 0.4); } 70% { box-shadow: 0 0 0 8px rgba(0, 230, 118, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 230, 118, 0); } }
        @keyframes float { 0% { transform: translateY(0); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0); } }
    </style>
</head>
<body>

<div id="login-screen">
    <h1 class="main-title">كأس العالم 2026</h1>
    <p class="subtitle">نظام الإدارة المونديالية الاحترافي</p>
    <div class="players-grid" id="players-grid"></div>
</div>

<div id="main-app" style="display: none;">
    <div class="top-nav">
        <div style="display: flex; align-items: center;">
            <div class="user-profile">
                <img id="nav-logo" src="" alt="Flag">
                <div>
                    <div id="nav-name" style="font-weight: 900; font-size: 1.1rem; color:#fff;"></div>
                    <div id="nav-team" style="color: var(--primary-glow); font-size: 0.8rem; font-weight: 800;"></div>
                </div>
            </div>
        </div>
        <button onclick="logout()" class="logout-btn">تسجيل الخروج</button>
    </div>

    <div class="tabs-container">
        <button class="tab-btn active" onclick="switchTab('standings', this)">ترتيب المجموعات</button>
        <button class="tab-btn" onclick="switchTab('my-matches', this)">مبارياتي</button>
        <button class="tab-btn" onclick="switchTab('best-thirds', this)">الثوالث وأفضل رابع</button>
        <button class="tab-btn" onclick="switchTab('knockout', this)">مسار الأدوار الإقصائية</button>
        <button id="admin-tab" class="tab-btn" onclick="switchTab('admin', this)" style="display:none; color:var(--admin-gold); border-color:var(--admin-gold);">إدارة المونديال</button>
    </div>

    <div id="standings-section" class="view-section active">
        <div id="groups-container"></div>
    </div>

    <div id="best-thirds-section" class="view-section">
        <div id="best-thirds-container"></div>
    </div>

    <div id="my-matches-section" class="view-section">
        <h2 class="section-title">جدول مبارياتك المونديالية</h2>
        <div id="my-matches-container"></div>
    </div>

    <div id="knockout-section" class="view-section">
        <h2 class="section-title">الطريق إلى النهائي</h2>
        <div id="knockout-container">
            <div class="glass-panel" style="text-align:center; color:var(--text-muted);">بانتظار تأهل المنتخبات لإنشاء المسار التلقائي...</div>
        </div>
    </div>

    <div id="admin-section" class="view-section">
        <div id="draw-section" style="margin-bottom: 25px;"></div>
        
        <div class="glass-panel" id="admin-controls-panel" style="display:none;">
            <h2 class="section-title">لوحة التحكم بالبطولة</h2>
            <select id="admin-mode-select" class="modern-select" onchange="toggleAdminMode()">
                <option value="league">إدخال نتائج المجموعات</option>
                <option value="knockout">إدخال نتائج الإقصائيات</option>
            </select>

            <div id="admin-league-panel">
                <select id="round-select" class="modern-select" onchange="loadAdminRound()">
                    <option value="1">الجولة الأولى</option>
                    <option value="2">الجولة الثانية</option>
                    <option value="3">الجولة الثالثة</option>
                </select>
                <div id="admin-matches-container" style="display:flex; flex-direction:column; gap:15px; margin-bottom:25px;"></div>
                <button class="btn-primary" onclick="saveRoundResults()">حفظ وتحديث النتائج</button>
            </div>

            <div id="admin-knockout-panel" style="display:none;">
                <div id="ko-generate-section" style="margin-bottom: 25px;"></div>
                <div id="admin-ko-matches-container" style="display:flex; flex-direction:column; gap:15px; margin-bottom:25px;"></div>
                <button id="save-ko-btn" class="btn-primary" onclick="saveKnockoutResults()" style="display:none;">حفظ وتحديث مسار البطولة</button>
            </div>
            
            <hr style="border-color: rgba(255,255,255,0.05); margin: 30px 0;">
            <button class="btn-primary btn-danger" onclick="resetTournament()">حذف البطولة الحالية وإعادة التهيئة ⚠️</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDYDSaOBIggJZCxdr5GpKuybVWRmheDeZk",
        authDomain: "superleague-ade00.firebaseapp.com",
        databaseURL: "https://superleague-ade00-default-rtdb.firebaseio.com",
        projectId: "superleague-ade00",
        storageBucket: "superleague-ade00.firebasestorage.app",
        messagingSenderId: "302472752303",
        appId: "1:302472752303:web:667c3971350051c583785a"
    };

    const officialPlayers = [
        { id: 1, name: "محمد مجيد", team: "البرتغال", logo: "https://upload.wikimedia.org/wikipedia/commons/5/5c/Flag_of_Portugal.svg", isAdmin: true },
        { id: 2, name: "يونس شلال", team: "إنكلترا", logo: "https://upload.wikimedia.org/wikipedia/en/b/be/Flag_of_England.svg", isAdmin: false },
        { id: 3, name: "عمر محمد", team: "كرواتيا", logo: "https://upload.wikimedia.org/wikipedia/commons/1/1b/Flag_of_Croatia.svg", isAdmin: false },
        { id: 4, name: "مصطفى محسن", team: "البرازيل", logo: "https://upload.wikimedia.org/wikipedia/en/0/05/Flag_of_Brazil.svg", isAdmin: false },
        { id: 5, name: "عمر علاء", team: "النرويج", logo: "https://upload.wikimedia.org/wikipedia/commons/d/d9/Flag_of_Norway.svg", isAdmin: false },
        { id: 6, name: "محمد طه", team: "اليابان", logo: "https://upload.wikimedia.org/wikipedia/en/9/9e/Flag_of_Japan.svg", isAdmin: false },
        { id: 7, name: "عبد احمد", team: "العراق", logo: "https://upload.wikimedia.org/wikipedia/commons/f/f6/Flag_of_Iraq.svg", isAdmin: false },
        { id: 8, name: "عبدالله قصي", team: "الأرجنتين", logo: "https://upload.wikimedia.org/wikipedia/commons/1/1a/Flag_of_Argentina.svg", isAdmin: false },
        { id: 9, name: "صهيب خالد", team: "فرنسا", logo: "https://upload.wikimedia.org/wikipedia/en/c/c3/Flag_of_France.svg", isAdmin: false },
        { id: 10, name: "مصطفى احمد", team: "هولندا", logo: "https://upload.wikimedia.org/wikipedia/commons/2/20/Flag_of_the_Netherlands.svg", isAdmin: false },
        { id: 11, name: "طه محمد", team: "إيطاليا", logo: "https://upload.wikimedia.org/wikipedia/en/0/03/Flag_of_Italy.svg", isAdmin: false },
        { id: 12, name: "يوسف نسيم", team: "إسبانيا", logo: "https://upload.wikimedia.org/wikipedia/en/9/9a/Flag_of_Spain.svg", isAdmin: false },
        { id: 13, name: "ايمن صالح", team: "كولومبيا", logo: "https://upload.wikimedia.org/wikipedia/commons/2/21/Flag_of_Colombia.svg", isAdmin: false },
        { id: 14, name: "خطاب أحمد", team: "المغرب", logo: "https://upload.wikimedia.org/wikipedia/commons/2/2c/Flag_of_Morocco.svg", isAdmin: false },
        { id: 15, name: "احمد قصي", team: "الجزائر", logo: "https://upload.wikimedia.org/wikipedia/commons/7/77/Flag_of_Algeria.svg", isAdmin: false },
        { id: 16, name: "طه حقي", team: "السعودية", logo: "https://upload.wikimedia.org/wikipedia/commons/0/0d/Flag_of_Saudi_Arabia.svg", isAdmin: false },
        { id: 17, name: "وائل مصطفى", team: "أمريكا", logo: "https://upload.wikimedia.org/wikipedia/en/a/a4/Flag_of_the_United_States.svg", isAdmin: false },
        { id: 18, name: "عبدالرحمن عمر", team: "تركيا", logo: "https://upload.wikimedia.org/wikipedia/commons/b/b4/Flag_of_Turkey.svg", isAdmin: false },
        { id: 19, name: "عباس محمد", team: "ساحل العاج", logo: "https://upload.wikimedia.org/wikipedia/commons/f/fe/Flag_of_C%C3%B4te_d%27Ivoire.svg", isAdmin: false },
        { id: 20, name: "حيدر عمر", team: "ألمانيا", logo: "https://upload.wikimedia.org/wikipedia/en/b/ba/Flag_of_Germany.svg", isAdmin: false }
    ];

    let state = { currentUser: null, teamsStats: [], fixtures: [], groupsConfig: {}, drawDone: false, knockout: { generated: false, matches: [] } };
    let isOnline = false, db = null;

    if (firebaseConfig.apiKey) {
        try { firebase.initializeApp(firebaseConfig); db = firebase.database(); isOnline = true; } 
        catch (e) { console.error(e); }
    }

    const SyncEngine = {
        save: function() {
            const data = { teamsStats: state.teamsStats, fixtures: state.fixtures, groupsConfig: state.groupsConfig, drawDone: state.drawDone, knockout: state.knockout };
            if (isOnline) db.ref('worldcup_master_live').set(data);
            else { localStorage.setItem('wc_master_db', JSON.stringify(data)); refreshUI(data); }
        },
        listen: function() {
            if (isOnline) db.ref('worldcup_master_live').on('value', snap => refreshUI(snap.val()));
            else refreshUI(JSON.parse(localStorage.getItem('wc_master_db')));
        }
    };

    function init() {
        document.getElementById('players-grid').innerHTML = officialPlayers.map(p => `
            <div class="player-card" onclick="login(${p.id})">
                <img src="${p.logo}" class="player-logo" loading="lazy">
                <div class="name">${p.name}</div>
                <div class="team-name">${p.team}</div>
                ${p.isAdmin ? '<div class="admin-badge">منظم البطولة</div>' : ''}
            </div>
        `).join('');

        const statusDiv = document.createElement('div');
        statusDiv.className = 'system-status';
        statusDiv.innerHTML = isOnline ? '<div class="status-dot dot-live"></div> متصل بالخوادم' : '<div class="status-dot dot-local" style="background:var(--admin-gold);"></div> اتصال محلي';
        document.body.appendChild(statusDiv);

        SyncEngine.listen();
        const saved = localStorage.getItem('wc_master_logged');
        if (saved) login(parseInt(saved), true);
    }

    function refreshUI(data) {
        if (data) {
            state.teamsStats = data.teamsStats || []; state.fixtures = data.fixtures || [];
            state.groupsConfig = data.groupsConfig || {}; state.drawDone = data.drawDone || false;
            state.knockout = data.knockout || { generated: false, matches: [] };
        } else {
            state.teamsStats = officialPlayers.map(p => ({ id: p.id, group:'', p:0, w:0, d:0, l:0, gf:0, ga:0, gd:0, pts:0, qualStatus: '' }));
            state.fixtures = []; state.groupsConfig = {}; state.drawDone = false; state.knockout = { generated: false, matches: [] };
            if (!isOnline) SyncEngine.save();
        }

        if (state.currentUser) {
            if (state.currentUser.isAdmin) setupAdmin();
            renderMyMatches();
        }
        calcStats(); processKnockoutTree(); renderKnockoutBracket();
    }

    function login(id, isAuto = false) {
        const user = officialPlayers.find(p => p.id === id);
        if (!user) return;
        if (user.isAdmin && !isAuto) {
            if (prompt("الرمز الأمني للمنظم:") !== "09128734") { alert("رفض الوصول: رمز غير صالح"); return; }
        }
        state.currentUser = user; localStorage.setItem('wc_master_logged', id);
        
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('main-app').style.display = 'block';
        document.getElementById('nav-logo').src = user.logo;
        document.getElementById('nav-name').innerText = user.name;
        document.getElementById('nav-team').innerText = user.team;

        if (user.isAdmin) document.getElementById('admin-tab').style.display = 'block';
        else document.getElementById('admin-tab').style.display = 'none';
        
        refreshUI({ teamsStats: state.teamsStats, fixtures: state.fixtures, groupsConfig: state.groupsConfig, drawDone: state.drawDone, knockout: state.knockout });
    }

    function logout() { localStorage.removeItem('wc_master_logged'); location.reload(); }
    function switchTab(id, btn) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
        btn.classList.add('active'); document.getElementById(id + '-section').classList.add('active');
    }

    function officialDraw() {
        if (state.drawDone) return;
        state.fixtures = []; state.groupsConfig = { A: [], B: [], C: [], D: [], E: [] };
        state.teamsStats = officialPlayers.map(p => ({ id: p.id, group:'', p:0, w:0, d:0, l:0, gf:0, ga:0, gd:0, pts:0, qualStatus: '' }));
        
        let shuffled = [...officialPlayers].sort(() => 0.5 - Math.random());
        let groupNames = ['A', 'B', 'C', 'D', 'E'];
        
        for(let i=0; i<20; i++) {
            let g = groupNames[Math.floor(i/4)];
            state.groupsConfig[g].push(shuffled[i].id);
            state.teamsStats.find(t => t.id === shuffled[i].id).group = g;
        }

        let mId = 1;
        for(let g in state.groupsConfig) {
            let t = state.groupsConfig[g];
            state.fixtures.push({ id: mId++, group: g, round: 1, homeId: t[0], awayId: t[3], homeScore: "", awayScore: "" });
            state.fixtures.push({ id: mId++, group: g, round: 1, homeId: t[1], awayId: t[2], homeScore: "", awayScore: "" });
            state.fixtures.push({ id: mId++, group: g, round: 2, homeId: t[3], awayId: t[1], homeScore: "", awayScore: "" });
            state.fixtures.push({ id: mId++, group: g, round: 2, homeId: t[2], awayId: t[0], homeScore: "", awayScore: "" });
            state.fixtures.push({ id: mId++, group: g, round: 3, homeId: t[0], awayId: t[1], homeScore: "", awayScore: "" });
            state.fixtures.push({ id: mId++, group: g, round: 3, homeId: t[2], awayId: t[3], homeScore: "", awayScore: "" });
        }
        state.drawDone = true; SyncEngine.save(); alert('تم إنشاء المجموعات بنجاح.');
    }

    function calcStats() {
        state.teamsStats.forEach(t => { t.p=0; t.w=0; t.d=0; t.l=0; t.gf=0; t.ga=0; t.gd=0; t.pts=0; t.qualStatus=''; });
        if (!state.drawDone) { renderTables([], [], []); return; }

        state.fixtures.forEach(m => {
            if (typeof m.homeScore === 'number' && typeof m.awayScore === 'number') {
                let h = state.teamsStats.find(t => t.id === m.homeId), a = state.teamsStats.find(t => t.id === m.awayId);
                if (h && a) {
                    h.p++; a.p++; h.gf += m.homeScore; a.gf += m.awayScore; h.ga += m.awayScore; a.ga += m.homeScore;
                    if (m.homeScore > m.awayScore) { h.w++; h.pts+=3; a.l++; }
                    else if (m.homeScore < m.awayScore) { a.w++; a.pts+=3; h.l++; }
                    else { h.d++; a.d++; h.pts+=1; a.pts+=1; }
                }
            }
        });

        state.teamsStats.forEach(t => { t.gd = t.gf - t.ga; });
        let thirdsPool = [], fourthsPool = [], groupWinners = [];

        ['A','B','C','D','E'].forEach(g => {
            let gTeams = state.teamsStats.filter(t => t.group === g);
            gTeams.sort((a, b) => {
                if (b.pts !== a.pts) return b.pts - a.pts;
                if (b.gd !== a.gd) return b.gd - a.gd; 
                if (b.gf !== a.gf) return b.gf - a.gf;
                return a.id - b.id;
            });
            gTeams.forEach((t, i) => {
                if(i === 0 || i === 1) { t.qualStatus = 'direct'; groupWinners.push({rank: i+1, group: g, team: t}); }
                if(i === 2) thirdsPool.push(t);
                if(i === 3) fourthsPool.push(t);
            });
        });

        // ترتيب الثوالث (الجميع 5 منتخبات يتأهلون)
        thirdsPool.sort((a, b) => {
            if (b.pts !== a.pts) return b.pts - a.pts;
            if (b.gd !== a.gd) return b.gd - a.gd; 
            if (b.gf !== a.gf) return b.gf - a.gf;
            return a.id - b.id;
        });
        thirdsPool.forEach(t => t.qualStatus = 'wildcard');

        // ترتيب أصحاب المركز الرابع (يتأهل فقط أفضل رابع لإكمال الـ 16)
        fourthsPool.sort((a, b) => {
            if (b.pts !== a.pts) return b.pts - a.pts;
            if (b.gd !== a.gd) return b.gd - a.gd; 
            if (b.gf !== a.gf) return b.gf - a.gf;
            return a.id - b.id;
        });
        fourthsPool.forEach((t, i) => { t.qualStatus = (i === 0) ? 'wildcard-4th' : 'out'; });

        renderTables(groupWinners, thirdsPool, fourthsPool);
    }

    // توليد المسار التلقائي للأدوار الإقصائية بناءً على (10 مباشر + 5 ثوالث + 1 أفضل رابع)
    function generateAutomaticBracket() {
        let directQual = state.teamsStats.filter(t => t.qualStatus === 'direct');
        let thirdQual = state.teamsStats.filter(t => t.qualStatus === 'wildcard');
        let fourthQual = state.teamsStats.filter(t => t.qualStatus === 'wildcard-4th');
        
        if (directQual.length + thirdQual.length + fourthQual.length !== 16) {
            alert('لم تكتمل المجموعات بعد لتحديد 16 متأهل!'); return;
        }

        let getTeam = (rank, grp) => {
            let grpTeams = state.teamsStats.filter(x => x.group === grp && x.pts > 0).sort((a,b)=> {
                if (b.pts !== a.pts) return b.pts - a.pts;
                if (b.gd !== a.gd) return b.gd - a.gd; 
                return b.gf - a.gf;
            });
            return grpTeams[rank-1].id;
        };

        // ترتيب الثوالث ثم دمج أفضل رابع في النهاية لتكوين الـ 6 بطاقات المتبقية
        let sortedThirds = thirdQual.sort((a,b)=> {
            if (b.pts !== a.pts) return b.pts - a.pts;
            if (b.gd !== a.gd) return b.gd - a.gd; return b.gf - a.gf;
        }).map(x => x.id);
        
        let bestFourthId = fourthQual.map(x => x.id);
        
        // مصفوفة 't' تحتوي الآن على (5 ثوالث + 1 رابع = 6 منتخبات) 
        let t = [...sortedThirds, ...bestFourthId];

        // تعيين المسار الثابت
        let R16 = [
            { id: 'r16_1', stage: 'r16', title: 'دور الـ 16 - M1', t1: getTeam(1,'A'), t2: t[0], s1:'', s2:'', p1:'', p2:'' },
            { id: 'r16_2', stage: 'r16', title: 'دور الـ 16 - M2', t1: getTeam(2,'B'), t2: getTeam(2,'C'), s1:'', s2:'', p1:'', p2:'' },
            { id: 'r16_3', stage: 'r16', title: 'دور الـ 16 - M3', t1: getTeam(1,'B'), t2: t[1], s1:'', s2:'', p1:'', p2:'' },
            { id: 'r16_4', stage: 'r16', title: 'دور الـ 16 - M4', t1: getTeam(2,'A'), t2: getTeam(2,'D'), s1:'', s2:'', p1:'', p2:'' },
            { id: 'r16_5', stage: 'r16', title: 'دور الـ 16 - M5', t1: getTeam(1,'C'), t2: t[2], s1:'', s2:'', p1:'', p2:'' },
            { id: 'r16_6', stage: 'r16', title: 'دور الـ 16 - M6', t1: getTeam(2,'E'), t2: t[5], s1:'', s2:'', p1:'', p2:'' }, // T6 اصبح الان أفضل رابع
            { id: 'r16_7', stage: 'r16', title: 'دور الـ 16 - M7', t1: getTeam(1,'D'), t2: t[3], s1:'', s2:'', p1:'', p2:'' },
            { id: 'r16_8', stage: 'r16', title: 'دور الـ 16 - M8', t1: getTeam(1,'E'), t2: t[4], s1:'', s2:'', p1:'', p2:'' }
        ];

        let QF = [
            { id: 'qf_1', stage: 'qf', title: 'ربع النهائي 1', t1: null, t2: null, s1:'', s2:'', p1:'', p2:'' },
            { id: 'qf_2', stage: 'qf', title: 'ربع النهائي 2', t1: null, t2: null, s1:'', s2:'', p1:'', p2:'' },
            { id: 'qf_3', stage: 'qf', title: 'ربع النهائي 3', t1: null, t2: null, s1:'', s2:'', p1:'', p2:'' },
            { id: 'qf_4', stage: 'qf', title: 'ربع النهائي 4', t1: null, t2: null, s1:'', s2:'', p1:'', p2:'' }
        ];

        let SF = [
            { id: 'sf_1', stage: 'sf', title: 'نصف النهائي 1', t1: null, t2: null, s1:'', s2:'', p1:'', p2:'' },
            { id: 'sf_2', stage: 'sf', title: 'نصف النهائي 2', t1: null, t2: null, s1:'', s2:'', p1:'', p2:'' }
        ];

        let FINAL = [{ id: 'final', stage: 'final', title: 'المباراة النهائية', t1: null, t2: null, s1:'', s2:'', p1:'', p2:'' }];

        state.knockout.matches = [...R16, ...QF, ...SF, ...FINAL];
        state.knockout.generated = true;
        SyncEngine.save(); alert('تم اعتماد المتأهلين وإنشاء المسار التلقائي بنجاح!');
        loadAdminKnockoutMatches();
    }

    function getKnockoutWinner(match) {
        if (!match || match.s1==='' || match.s2==='') return null;
        let s1 = parseInt(match.s1), s2 = parseInt(match.s2);
        if (s1 > s2) return match.t1; if (s2 > s1) return match.t2;
        if (match.p1 !== '' && match.p2 !== '') {
            let p1 = parseInt(match.p1), p2 = parseInt(match.p2);
            if (p1 > p2) return match.t1; if (p2 > p1) return match.t2;
        }
        return 'tie'; 
    }

    function processKnockoutTree() {
        if (!state.knockout || !state.knockout.generated) return;
        const findM = id => state.knockout.matches.find(m => m.id === id);
        
        let updateNext = (curId, nextId, slot) => {
            let w = getKnockoutWinner(findM(curId)), nextM = findM(nextId);
            if (slot === 1) nextM.t1 = (w !== 'tie' && w != null) ? w : null;
            if (slot === 2) nextM.t2 = (w !== 'tie' && w != null) ? w : null;
        };

        updateNext('r16_1', 'qf_1', 1); updateNext('r16_2', 'qf_1', 2);
        updateNext('r16_3', 'qf_2', 1); updateNext('r16_4', 'qf_2', 2);
        updateNext('r16_5', 'qf_3', 1); updateNext('r16_6', 'qf_3', 2);
        updateNext('r16_7', 'qf_4', 1); updateNext('r16_8', 'qf_4', 2);

        updateNext('qf_1', 'sf_1', 1); updateNext('qf_2', 'sf_1', 2);
        updateNext('qf_3', 'sf_2', 1); updateNext('qf_4', 'sf_2', 2);

        updateNext('sf_1', 'final', 1); updateNext('sf_2', 'final', 2);
    }

    function renderKnockoutBracket() {
        const cont = document.getElementById('knockout-container');
        if (!state.knockout || !state.knockout.generated) {
            cont.innerHTML = `<div class="glass-panel" style="text-align:center; color:var(--text-muted);">بانتظار تأهل المنتخبات واعتماد المسار التلقائي...</div>`;
            return;
        }

        const findM = id => state.knockout.matches.find(m => m.id === id);
        
        const renderMatchBox = (mId) => {
            let m = findM(mId); if(!m) return '';
            let t1 = m.t1 ? officialPlayers.find(p => p.id === m.t1) : { name: "يحدد لاحقاً", logo: "https://upload.wikimedia.org/wikipedia/commons/e/e0/Placeholder_flag.svg" };
            let t2 = m.t2 ? officialPlayers.find(p => p.id === m.t2) : { name: "يحدد لاحقاً", logo: "https://upload.wikimedia.org/wikipedia/commons/e/e0/Placeholder_flag.svg" };
            
            let s1 = m.s1 !== '' ? m.s1 : '-'; let s2 = m.s2 !== '' ? m.s2 : '-';
            let p1 = m.p1 !== '' ? ` <span class="pen-score">(${m.p1})</span>` : '';
            let p2 = m.p2 !== '' ? ` <span class="pen-score">(${m.p2})</span>` : '';
            
            let winner = getKnockoutWinner(m);
            let activeClass = (winner && winner !== 'tie') ? 'active-match' : '';

            return `
            <div class="bracket-node ${activeClass}">
                <div class="match-label">${m.title}</div>
                <div class="bracket-team ${!m.t1 ? 'tba-text' : ''}" style="${winner===m.t1 ? 'background:rgba(212,175,55,0.15);' : ''}">
                    <img src="${t1.logo}"><div class="t-name">${t1.name}</div><div class="t-score">${s1}${p1}</div>
                </div>
                <div class="bracket-team ${!m.t2 ? 'tba-text' : ''}" style="border:none; ${winner===m.t2 ? 'background:rgba(212,175,55,0.15);' : ''}">
                    <img src="${t2.logo}"><div class="t-name">${t2.name}</div><div class="t-score">${s2}${p2}</div>
                </div>
            </div>`;
        };

        let html = `
        <div class="bracket-wrapper">
            <div class="bracket-container">
                <!-- النصف الأيمن -->
                <div class="bracket-column">
                    ${renderMatchBox('r16_1')}${renderMatchBox('r16_2')}${renderMatchBox('r16_3')}${renderMatchBox('r16_4')}
                </div>
                <div class="bracket-column" style="justify-content:space-around;">
                    ${renderMatchBox('qf_1')}${renderMatchBox('qf_2')}
                </div>
                <div class="bracket-column" style="justify-content:center;">
                    ${renderMatchBox('sf_1')}
                </div>
                
                <!-- النهائي في المنتصف -->
                <div class="bracket-column center" style="justify-content:center;">
                    <div class="trophy-container">
                        <img src="https://upload.wikimedia.org/wikipedia/en/thumb/e/e3/2026_FIFA_World_Cup_logo.svg/1200px-2026_FIFA_World_Cup_logo.svg.png" style="width:120px; filter: drop-shadow(0 0 20px rgba(212,175,55,0.8));">
                    </div>
                    ${renderMatchBox('final')}
                </div>
                
                <!-- النصف الأيسر -->
                <div class="bracket-column" style="justify-content:center;">
                    ${renderMatchBox('sf_2')}
                </div>
                <div class="bracket-column" style="justify-content:space-around;">
                    ${renderMatchBox('qf_3')}${renderMatchBox('qf_4')}
                </div>
                <div class="bracket-column">
                    ${renderMatchBox('r16_5')}${renderMatchBox('r16_6')}${renderMatchBox('r16_7')}${renderMatchBox('r16_8')}
                </div>
            </div>
        </div>`;
        cont.innerHTML = html;
    }

    function toggleAdminMode() {
        const mode = document.getElementById('admin-mode-select').value;
        if (mode === 'league') { document.getElementById('admin-league-panel').style.display = 'block'; document.getElementById('admin-knockout-panel').style.display = 'none'; loadAdminRound(); }
        else { document.getElementById('admin-league-panel').style.display = 'none'; document.getElementById('admin-knockout-panel').style.display = 'block'; loadAdminKnockoutMatches(); }
    }

    function setupAdmin() {
        const drawSec = document.getElementById('draw-section');
        const controls = document.getElementById('admin-controls-panel');
        if (!state.drawDone) {
            drawSec.innerHTML = `<button class="btn-primary" onclick="officialDraw()">إجراء قرعة المجموعات وتوليد الجداول (20 منتخب)</button>`;
            drawSec.style.display = 'block'; controls.style.display = 'none';
        } else { 
            drawSec.style.display = 'none'; controls.style.display = 'block';
            
            const koGenSec = document.getElementById('ko-generate-section');
            if (!state.knockout || !state.knockout.generated) {
                koGenSec.innerHTML = `<button class="btn-primary" style="background:var(--success); color:#000; border:none;" onclick="generateAutomaticBracket()">اعتماد المتأهلين الـ 16 وتوليد المسار التلقائي للبطولة</button>`;
            } else { koGenSec.innerHTML = ''; }
        }
        loadAdminRound(); loadAdminKnockoutMatches();
    }

    function loadAdminRound() {
        const cont = document.getElementById('admin-matches-container');
        if (!state.drawDone) { cont.innerHTML = ''; return; }
        const r = parseInt(document.getElementById('round-select').value);
        let html = '';
        state.fixtures.filter(m => m.round === r).forEach(m => {
            const h = officialPlayers.find(p => p.id === m.homeId), a = officialPlayers.find(p => p.id === m.awayId);
            html += `
            <div class="match-card" data-id="${m.id}" style="padding:15px;">
                <div style="text-align:center; color:var(--text-muted); font-size:0.75rem; font-weight:800; margin-bottom:10px;">المجموعة ${m.group}</div>
                <div class="teams-row">
                    <div class="team" style="width:35%;"><img src="${h.logo}" style="width:40px;height:40px;"><span>${h.name}</span></div>
                    <div class="score-area" style="width:30%; flex-direction:row; justify-content:center; gap:5px;">
                        <input type="number" class="h-in score-input" min="0" value="${m.homeScore}">
                        <span style="color:var(--text-muted); font-weight:900;">-</span>
                        <input type="number" class="a-in score-input" min="0" value="${m.awayScore}">
                    </div>
                    <div class="team" style="width:35%;"><img src="${a.logo}" style="width:40px;height:40px;"><span>${a.name}</span></div>
                </div>
            </div>`;
        });
        cont.innerHTML = html;
    }

    function loadAdminKnockoutMatches() {
        const cont = document.getElementById('admin-ko-matches-container');
        const btn = document.getElementById('save-ko-btn');
        if (!state.knockout || !state.knockout.generated) { cont.innerHTML = '<div style="color:var(--text-muted); text-align:center;">قم بإنهاء المجموعات أولاً لتوليد المسار.</div>'; btn.style.display = 'none'; return; }
        
        btn.style.display = 'block'; let html = '';
        state.knockout.matches.forEach(m => {
            let t1 = m.t1 ? officialPlayers.find(p => p.id === m.t1) : { name: "يحدد لاحقاً", logo: "https://upload.wikimedia.org/wikipedia/commons/e/e0/Placeholder_flag.svg" };
            let t2 = m.t2 ? officialPlayers.find(p => p.id === m.t2) : { name: "يحدد لاحقاً", logo: "https://upload.wikimedia.org/wikipedia/commons/e/e0/Placeholder_flag.svg" };
            
            html += `
            <div class="match-card ko-admin-card" data-ko-id="${m.id}" style="${!(m.t1 && m.t2) ? 'opacity:0.5; pointer-events:none;' : 'border-color:var(--primary-glow);'}">
                <div style="text-align:center; color:var(--primary-glow); font-size:0.85rem; font-weight:800; margin-bottom:15px;">${m.title}</div>
                <div class="teams-row" style="align-items:flex-start;">
                    <div class="team" style="width:25%;"><img src="${t1.logo}" style="width:40px;height:40px;"><span style="font-size:0.8rem;">${t1.name}</span></div>
                    <div style="width:50%; display:flex; flex-direction:column; gap:10px; align-items:center;">
                        <div style="font-size:0.75rem; color:var(--text-muted);">النتيجة الأصلية</div>
                        <div style="display:flex; align-items:center; gap:8px;">
                            <input type="number" class="ko-s1 score-input" value="${m.s1}"> - <input type="number" class="ko-s2 score-input" value="${m.s2}">
                        </div>
                        <div style="font-size:0.75rem; color:var(--danger); margin-top:5px;">ركلات الترجيح</div>
                        <div style="display:flex; align-items:center; gap:8px;">
                            <input type="number" class="ko-p1 score-input pen-input" placeholder="ترجيح" value="${m.p1}"> - <input type="number" class="ko-p2 score-input pen-input" placeholder="ترجيح" value="${m.p2}">
                        </div>
                    </div>
                    <div class="team" style="width:25%;"><img src="${t2.logo}" style="width:40px;height:40px;"><span style="font-size:0.8rem;">${t2.name}</span></div>
                </div>
            </div>`;
        });
        cont.innerHTML = html;
    }

    function saveRoundResults() {
        if (!state.drawDone) return;
        document.querySelectorAll('#admin-matches-container .match-card').forEach(c => {
            const m = state.fixtures.find(x => x.id === parseInt(c.getAttribute('data-id')));
            if (m) {
                const hVal = c.querySelector('.h-in').value, aVal = c.querySelector('.a-in').value;
                if (hVal !== '' && aVal !== '') { m.homeScore = parseInt(hVal); m.awayScore = parseInt(aVal); }
                else { m.homeScore = ""; m.awayScore = ""; }
            }
        });
        SyncEngine.save(); alert("تم حفظ النتائج بنجاح!");
    }

    function saveKnockoutResults() {
        if (!state.knockout || !state.knockout.generated) return;
        document.querySelectorAll('.ko-admin-card').forEach(c => {
            let m = state.knockout.matches.find(x => x.id === c.getAttribute('data-ko-id'));
            if (m) {
                m.s1 = c.querySelector('.ko-s1').value; m.s2 = c.querySelector('.ko-s2').value;
                m.p1 = c.querySelector('.ko-p1').value; m.p2 = c.querySelector('.ko-p2').value;
            }
        });
        processKnockoutTree(); SyncEngine.save(); alert("تم حفظ وتحديث مسار البطولة بنجاح!"); loadAdminKnockoutMatches();
    }

    function resetTournament() {
        if(confirm("تحذير ⚠️: سيتم مسح جميع الجداول والنتائج والبدء من جديد. هل أنت متأكد تماماً؟")) {
            state.fixtures = []; state.groupsConfig = {}; state.drawDone = false; state.knockout = { generated: false, matches: [] };
            SyncEngine.save(); alert("تم إعادة تهيئة النظام بالكامل."); location.reload();
        }
    }

    window.onload = init;
</script>
</body>
</html>
