<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البطولة الأسطورية - Super League</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --bg-color: #0b0e14;
            --panel-bg: rgba(20, 25, 35, 0.7);
            --primary-cyan: #00f0ff;
            --admin-gold: #ffd700;
            --text-main: #ffffff;
            --text-muted: #8892b0;
            --danger: #ff1744;
            --success: #00e676;
            --border-color: rgba(255, 255, 255, 0.05);
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 50px;
        }

        /* Glassmorphism Panels */
        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        /* Login Screen */
        #login-screen {
            padding: 40px 20px;
            max-width: 1000px;
            margin: auto;
            text-align: center;
        }
        
        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 30px;
        }

        .player-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        .player-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary-cyan);
            background: rgba(0, 240, 255, 0.05);
        }

        .player-logo {
            width: 60px;
            height: 60px;
            object-fit: contain;
            margin-bottom: 10px;
        }

        .admin-badge {
            background: rgba(255, 215, 0, 0.1);
            color: var(--admin-gold);
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 4px;
            margin-top: 8px;
            display: inline-block;
        }

        /* Top Navigation */
        .top-nav {
            background: #11151c;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-profile img {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }

        /* Tabs */
        .tabs-container {
            display: flex;
            gap: 10px;
            padding: 20px;
            max-width: 1200px;
            margin: auto;
            overflow-x: auto;
        }

        .tab-btn {
            background: var(--panel-bg);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            white-space: nowrap;
        }

        .tab-btn.active {
            background: var(--primary-cyan);
            color: #000;
            border-color: var(--primary-cyan);
        }

        /* Main Content Area */
        .view-section {
            display: none;
            max-width: 1200px;
            margin: auto;
            padding: 0 20px;
        }

        .view-section.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        /* Table Styles */
        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 0.9rem;
        }

        th {
            color: var(--text-muted);
            padding: 15px 10px;
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
            white-space: nowrap;
        }

        td {
            padding: 15px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
            white-space: nowrap;
        }

        .team-info {
            display: flex;
            align-items: center;
            gap: 10px;
            text-align: right;
        }

        .team-info img {
            width: 30px;
            height: 30px;
            object-fit: contain;
        }

        .pts-col {
            color: var(--primary-cyan);
            font-weight: 900;
            font-size: 1.1rem;
        }

        .status-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .badge-qual { background: rgba(0, 240, 255, 0.1); color: var(--primary-cyan); }
        .badge-out { background: rgba(255, 23, 68, 0.1); color: var(--danger); }

        .qualified-boundary td {
            border-bottom: 2px dashed rgba(0, 240, 255, 0.3);
        }

        /* Matches UI */
        .match-card {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .teams-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 8px;
        }

        .team {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 80px;
            gap: 5px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .team img {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }

        .score-box {
            background: rgba(255,255,255,0.05);
            padding: 8px 15px;
            border-radius: 6px;
            font-size: 1.2rem;
            font-weight: 900;
            letter-spacing: 2px;
        }
        
        .score-box.pending {
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 0;
        }

        /* Admin Controls */
        .score-input {
            width: 50px;
            height: 40px;
            text-align: center;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 6px;
        }

        .score-input:focus {
            outline: none;
            border-color: var(--primary-cyan);
        }

        .btn-primary {
            background: linear-gradient(135deg, #00f0ff, #0080ff);
            color: #000;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }
        
        .btn-primary:hover {
            opacity: 0.9;
            transform: scale(0.99);
        }

        .system-status {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            gap: 5px;
            z-index: 1000;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        .dot-live { background: #00e676; box-shadow: 0 0 8px #00e676; }
        .dot-local { background: #ffea00; box-shadow: 0 0 8px #ffea00; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Hide scrollbar for tabs */
        .tabs-container::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h1 style="color: var(--primary-cyan); margin-bottom: 10px;">🏆 البطولة الأسطورية</h1>
        <p style="color: var(--text-muted);">الرجاء اختيار النادي الخاص بك للدخول إلى النظام</p>
        <div class="players-grid" id="players-grid"></div>
    </div>

    <div id="main-app" style="display: none;">
        
        <div class="top-nav">
            <div class="user-profile">
                <img id="nav-logo" src="" alt="Club Logo">
                <div>
                    <div id="nav-name" style="font-weight: bold; font-size: 0.9rem;"></div>
                    <div id="nav-club" style="color: var(--primary-cyan); font-size: 0.75rem;"></div>
                </div>
            </div>
            <button onclick="logout()" style="background:none; border:none; color:var(--danger); cursor:pointer; font-weight:bold;">خروج</button>
        </div>

        <div class="tabs-container">
            <button class="tab-btn active" onclick="switchTab('standings', this)">الترتيب العام</button>
            <button class="tab-btn" onclick="switchTab('my-matches', this)">مبارياتي</button>
            <button id="admin-tab" class="tab-btn" onclick="switchTab('admin', this)" style="display:none; color:var(--admin-gold); border-color:var(--admin-gold);">لوحة التحكم</button>
        </div>

        <div id="standings-section" class="view-section active">
            <div class="glass-panel table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th style="text-align:right;">اللاعب / النادي</th>
                            <th>لعب</th>
                            <th>فاز</th>
                            <th>تعادل</th>
                            <th>خسر</th>
                            <th>له</th>
                            <th>عليه</th>
                            <th>الفارق</th>
                            <th>نقاط</th>
                            <th>الحالة</th>
                        </tr>
                    </thead>
                    <tbody id="standings-body">
                        </tbody>
                </table>
            </div>
        </div>

        <div id="my-matches-section" class="view-section">
            <h3 style="margin-bottom:15px; color:var(--primary-cyan);">مبارياتك المجدولة</h3>
            <div id="my-matches-container"></div>
        </div>

        <div id="admin-section" class="view-section">
            <div class="glass-panel" id="draw-section"></div>
            
            <div class="glass-panel">
                <h3 style="margin-bottom:15px;">إدخال النتائج</h3>
                <select id="round-select" onchange="loadAdminRound()" style="width:100%; padding:10px; background:rgba(0,0,0,0.5); color:white; border:1px solid var(--border-color); border-radius:6px; margin-bottom:15px;"></select>
                
                <div id="admin-matches-container" style="display:flex; flex-direction:column; gap:10px; margin-bottom:20px;"></div>
                
                <button id="save-btn" class="btn-primary" onclick="saveRoundResults()">حفظ وتحديث النتائج 💾</button>
            </div>
        </div>

    </div>

    <script>
        // إعدادات Firebase الخاصة بك
        const firebaseConfig = {
            apiKey: "AIzaSyDYDSaOBIggJZCxdr5GpKuybVWRmheDeZk",
            authDomain: "superleague-ade00.firebaseapp.com",
            databaseURL: "https://superleague-ade00-default-rtdb.firebaseio.com",
            projectId: "superleague-ade00",
            storageBucket: "superleague-ade00.firebasestorage.app",
            messagingSenderId: "302472752303",
            appId: "1:302472752303:web:667c3971350051c583785a"
        };

        const officialPlayers = [
            { id: 1, name: "محمد مجيد", club: "النصر السعودي", logo: "https://i.supaimg.com/4d83dc19-3e52-40fd-ba22-d0e725844112/5bac387e-a96a-4133-923f-4bf011d5613e.png", isAdmin: true },
            { id: 2, name: "عمر محمد", club: "ريال مدريد", logo: "https://upload.wikimedia.org/wikipedia/en/5/56/Real_Madrid_CF.svg", isAdmin: false },
            { id: 3, name: "ليث اسامه", club: "بايرن ميونخ", logo: "https://upload.wikimedia.org/wikipedia/commons/1/1b/FC_Bayern_M%C3%BCnchen_logo_%282017%29.svg", isAdmin: false },
            { id: 4, name: "صهيب خالد", club: "إنتر ميلان", logo: "https://upload.wikimedia.org/wikipedia/commons/0/05/FC_Internazionale_Milano_2021.svg", isAdmin: false },
            { id: 5, name: "اسامه محمد", club: "برشلونة", logo: "https://upload.wikimedia.org/wikipedia/en/4/47/FC_Barcelona_%28crest%29.svg", isAdmin: false },
            { id: 6, name: "احمد علي", club: "أتلتيكو مدريد", logo: "https://i.supaimg.com/4d83dc19-3e52-40fd-ba22-d0e725844112/4cb14d7a-0611-4d1f-881f-328adfd6c919.png", isAdmin: false },
            { id: 7, name: "يوسف نسيم", club: "توتنهام", logo: "https://upload.wikimedia.org/wikipedia/en/b/b4/Tottenham_Hotspur.svg", isAdmin: false },
            { id: 8, name: "محمد خالد", club: "تشيلسي", logo: "https://upload.wikimedia.org/wikipedia/en/c/cc/Chelsea_FC.svg", isAdmin: false },
            { id: 9, name: "يزن فلاح", club: "مانشستر سيتي", logo: "https://upload.wikimedia.org/wikipedia/en/e/eb/Manchester_City_FC_badge.svg", isAdmin: false },
            { id: 10, name: "طه محمد", club: "الهلال السعودي", logo: "https://i.supaimg.com/4d83dc19-3e52-40fd-ba22-d0e725844112/2c6c181b-5092-413a-86d3-e81d9fa0e335.png", isAdmin: false },
            { id: 11, name: "يونس شلال", club: "إي سي ميلان", logo: "https://upload.wikimedia.org/wikipedia/commons/d/d0/Logo_of_AC_Milan.svg", isAdmin: false },
            { id: 12, name: "ياسين شلال", club: "أرسنال", logo: "https://upload.wikimedia.org/wikipedia/en/5/53/Arsenal_FC.svg", isAdmin: false },
            { id: 13, name: "أيمن صالح", club: "باريس سان جيرمان", logo: "https://upload.wikimedia.org/wikipedia/en/a/a7/Paris_Saint-Germain_F.C..svg", isAdmin: false },
            { id: 14, name: "همام احمد", club: "ليفربول", logo: "https://upload.wikimedia.org/wikipedia/en/0/0c/Liverpool_FC.svg", isAdmin: false },
            { id: 15, name: "محمد طه", club: "روما", logo: "https://upload.wikimedia.org/wikipedia/en/f/f7/AS_Roma_logo_%282017%29.svg", isAdmin: false },
            { id: 16, name: "خطاب احمد", club: "كومو", logo: "https://i.supaimg.com/4d83dc19-3e52-40fd-ba22-d0e725844112/3f302b65-1266-4b34-8007-3ed20dabf39e.png", isAdmin: false }
        ];

        let state = { currentUser: null, teamsStats: [], fixtures: [], drawDone: false };
        let isOnline = false;
        let db = null;

        // تهيئة محرك المزامنة
        if (firebaseConfig.apiKey) {
            try {
                firebase.initializeApp(firebaseConfig);
                db = firebase.database();
                isOnline = true;
            } catch (e) {
                console.error("Firebase Init Error:", e);
            }
        }

        const SyncEngine = {
            save: function() {
                const data = { teamsStats: state.teamsStats, fixtures: state.fixtures, drawDone: state.drawDone };
                if (isOnline) db.ref('superleague_live').set(data);
                else { localStorage.setItem('sl_db', JSON.stringify(data)); refreshUI(data); }
            },
            listen: function() {
                if (isOnline) {
                    db.ref('superleague_live').on('value', snap => refreshUI(snap.val()));
                } else {
                    const local = JSON.parse(localStorage.getItem('sl_db'));
                    refreshUI(local);
                }
            }
        };

        function init() {
            // رسم شاشة الدخول
            document.getElementById('players-grid').innerHTML = officialPlayers.map(p => `
                <div class="player-card ${p.isAdmin ? 'admin-card' : ''}" onclick="login(${p.id})">
                    <img src="${p.logo}" class="player-logo" loading="lazy">
                    <div style="font-weight:bold;">${p.name}</div>
                    <div style="font-size:0.8rem; color:var(--text-muted);">${p.club}</div>
                    ${p.isAdmin ? '<div class="admin-badge">المنظم</div>' : ''}
                </div>
            `).join('');

            // مؤشر حالة السيرفر
            const statusDiv = document.createElement('div');
            statusDiv.className = 'system-status';
            statusDiv.innerHTML = isOnline 
                ? '<div class="status-dot dot-live"></div> السيرفر متصل' 
                : '<div class="status-dot dot-local"></div> وضع الأوفلاين';
            document.body.appendChild(statusDiv);

            SyncEngine.listen();

            // تسجيل الدخول التلقائي
            const saved = localStorage.getItem('sl_logged_user');
            if (saved) login(parseInt(saved), true);
        }

        function refreshUI(data) {
            if (data) {
                state.teamsStats = data.teamsStats || [];
                state.fixtures = data.fixtures || [];
                state.drawDone = data.drawDone || false;
            } else {
                state.teamsStats = officialPlayers.map(p => ({ id: p.id, p:0, w:0, d:0, l:0, gf:0, ga:0, gd:0, pts:0 }));
                state.fixtures = [];
                state.drawDone = false;
                if (!isOnline) SyncEngine.save();
            }

            if (state.currentUser) {
                if (state.currentUser.isAdmin) setupAdmin();
                renderMyMatches();
            }
            calcStats();
        }

        function login(id, isAuto = false) {
            const user = officialPlayers.find(p => p.id === id);
            if (!user) return;

            if (user.isAdmin && !isAuto) {
                const pass = prompt("رمز المرور للمنظم:");
                if (pass !== "09128734") { alert("❌ الرمز خاطئ!"); return; }
            }

            state.currentUser = user;
            localStorage.setItem('sl_logged_user', id);
            
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            document.getElementById('nav-logo').src = user.logo;
            document.getElementById('nav-name').innerText = user.name;
            document.getElementById('nav-club').innerText = user.club;

            if (user.isAdmin) {
                document.getElementById('admin-tab').style.display = 'block';
                setupAdmin();
            } else {
                document.getElementById('admin-tab').style.display = 'none';
            }
            
            refreshUI({ teamsStats: state.teamsStats, fixtures: state.fixtures, drawDone: state.drawDone });
        }

        function logout() {
            localStorage.removeItem('sl_logged_user');
            location.reload();
        }

        function switchTab(id, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(id + '-section').classList.add('active');
        }

        function officialDraw() {
            if (state.drawDone) return;
            state.fixtures = [];
            state.teamsStats = officialPlayers.map(p => ({ id: p.id, p:0, w:0, d:0, l:0, gf:0, ga:0, gd:0, pts:0 }));
            
            let tIds = officialPlayers.map(p => p.id);
            let n = tIds.length;
            let mId = 1;

            for (let r = 0; r < 8; r++) {
                for (let i = 0; i < n/2; i++) {
                    let home = tIds[i], away = tIds[n - 1 - i];
                    // تم استخدام نصوص فارغة بدلاً من null لمنع أخطاء Firebase
                    state.fixtures.push({ id: mId++, round: r+1, homeId: home, awayId: away, homeScore: "", awayScore: "" });
                }
                tIds.splice(1, 0, tIds.pop());
            }
            state.drawDone = true;
            SyncEngine.save(); 
            alert('تم إجراء القرعة بنجاح ✅');
        }

        function calcStats() {
            state.teamsStats.forEach(t => { t.p=0; t.w=0; t.d=0; t.l=0; t.gf=0; t.ga=0; t.gd=0; t.pts=0; });

            if (!state.drawDone) { renderTable(); return; }

            state.fixtures.forEach(m => {
                // الفحص الذكي: حساب النتيجة فقط إذا كانت رقماً صحيحاً
                if (typeof m.homeScore === 'number' && typeof m.awayScore === 'number') {
                    let h = state.teamsStats.find(t => t.id === m.homeId);
                    let a = state.teamsStats.find(t => t.id === m.awayId);
                    
                    if (h && a) {
                        h.p++; a.p++; h.gf += m.homeScore; a.gf += m.awayScore;
                        h.ga += m.awayScore; a.ga += m.homeScore;

                        if (m.homeScore > m.awayScore) { h.w++; h.pts+=3; a.l++; }
                        else if (m.homeScore < m.awayScore) { a.w++; a.pts+=3; h.l++; }
                        else { h.d++; a.d++; h.pts+=1; a.pts+=1; }
                    }
                }
            });

            state.teamsStats.forEach(t => { t.gd = t.gf - t.ga; });
            
            // ترتيب الجدول بذكاء (النقاط > فارق الأهداف > الأهداف المسجلة > الأهداف المستقبلة)
            state.teamsStats.sort((a, b) => {
                if (b.pts !== a.pts) return b.pts - a.pts;
                if (b.gd !== a.gd) return b.gd - a.gd; 
                if (b.gf !== a.gf) return b.gf - a.gf;
                if (a.ga !== b.ga) return a.ga - b.ga;
                return 0;
            });
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('standings-body');
            if (!state.drawDone) {
                tbody.innerHTML = `<tr><td colspan="11" style="padding:40px; color:var(--text-muted);">بانتظار القرعة الرسمية...</td></tr>`;
                return;
            }

            let html = '';
            state.teamsStats.forEach((t, i) => {
                const p = officialPlayers.find(x => x.id === t.id);
                if (!p) return;
                const isMe = state.currentUser && state.currentUser.id === p.id;
                const r = i + 1;
                const badge = r <= 8 ? '<span class="status-badge badge-qual">ربع النهائي</span>' : '<span class="status-badge badge-out">إقصاء</span>';
                const rowClass = r === 8 ? 'qualified-boundary' : '';
                const bg = isMe ? 'background: rgba(0, 240, 255, 0.05); border-right: 3px solid var(--primary-cyan);' : '';

                html += `
                <tr class="${rowClass}" style="${bg}">
                    <td style="color:${r<=4 ? 'var(--admin-gold)' : 'var(--text-muted)'}; font-weight:900;">${r}</td>
                    <td>
                        <div class="team-info">
                            <img src="${p.logo}" loading="lazy">
                            <div>
                                <div style="${isMe ? 'color:var(--primary-cyan); font-weight:bold;' : 'font-weight:bold;'}">${p.name}</div>
                                <div style="font-size:0.75rem; color:var(--text-muted);">${p.club}</div>
                            </div>
                        </div>
                    </td>
                    <td>${t.p}</td><td>${t.w}</td><td>${t.d}</td><td>${t.l}</td>
                    <td style="color:var(--success)">${t.gf}</td><td style="color:var(--danger)">${t.ga}</td>
                    <td style="direction:ltr; color:${t.gd > 0 ? 'var(--primary-cyan)' : t.gd < 0 ? 'var(--danger)' : 'inherit'}">${t.gd > 0 ? '+'+t.gd : t.gd}</td>
                    <td class="pts-col">${t.pts}</td><td>${badge}</td>
                </tr>`;
            });
            tbody.innerHTML = html;
        }

        function renderMyMatches() {
            const cont = document.getElementById('my-matches-container');
            if (!state.drawDone) {
                cont.innerHTML = `<div class="glass-panel" style="text-align:center;">بانتظار القرعة الرسمية...</div>`;
                return;
            }

            const matches = state.fixtures.filter(m => m.homeId === state.currentUser.id || m.awayId === state.currentUser.id);
            let html = '';
            
            matches.forEach(m => {
                const isH = m.homeId === state.currentUser.id;
                const opp = officialPlayers.find(p => p.id === (isH ? m.awayId : m.homeId));
                let ms = isH ? m.homeScore : m.awayScore;
                let os = isH ? m.awayScore : m.homeScore;
                
                let scoreHtml = (typeof ms === 'number' && typeof os === 'number') 
                    ? `<div class="score-box">${ms} - ${os}</div>` 
                    : `<div class="score-box pending">لم تُلعب</div>`;

                html += `
                <div class="glass-panel match-card">
                    <div style="display:flex; justify-content:space-between; color:var(--text-muted); font-size:0.8rem; font-weight:bold;">
                        <span>الجولة ${m.round}</span>
                        <span>ملعب محايد</span> 
                    </div>
                    <div class="teams-row">
                        <div class="team">
                            <img src="${state.currentUser.logo}">
                            <span style="color:var(--primary-cyan)">أنت</span>
                        </div>
                        ${scoreHtml}
                        <div class="team">
                            <img src="${opp.logo}">
                            <span>${opp.name}</span>
                        </div>
                    </div>
                </div>`;
            });
            cont.innerHTML = html;
        }

        function setupAdmin() {
            const sel = document.getElementById('round-select');
            if (sel.innerHTML === '') {
                for(let i=1; i<=8; i++) sel.innerHTML += `<option value="${i}">نتائج الجولة ${i}</option>`;
            }
            
            const drawSec = document.getElementById('draw-section');
            if (!state.drawDone) {
                drawSec.innerHTML = `<button class="btn-primary" onclick="officialDraw()">إجراء القرعة الرسمية 🎲</button>`;
                drawSec.style.display = 'block';
            } else {
                drawSec.style.display = 'none';
            }
            loadAdminRound();
        }

        function loadAdminRound() {
            const cont = document.getElementById('admin-matches-container');
            if (!state.drawDone) { cont.innerHTML = ''; return; }

            const r = parseInt(document.getElementById('round-select').value);
            const matches = state.fixtures.filter(m => m.round === r);
            let html = '';
            
            matches.forEach(m => {
                const h = officialPlayers.find(p => p.id === m.homeId);
                const a = officialPlayers.find(p => p.id === m.awayId);
                const hVal = typeof m.homeScore === 'number' ? m.homeScore : '';
                const aVal = typeof m.awayScore === 'number' ? m.awayScore : '';

                html += `
                <div class="match-card" data-id="${m.id}">
                    <div class="teams-row">
                        <div class="team"><img src="${h.logo}"><span>${h.name}</span></div>
                        <div style="display:flex; align-items:center; gap:10px;">
                            <input type="number" class="h-in score-input" min="0" value="${hVal}">
                            <span style="color:var(--text-muted); font-weight:bold;">VS</span>
                            <input type="number" class="a-in score-input" min="0" value="${aVal}">
                        </div>
                        <div class="team"><img src="${a.logo}"><span>${a.name}</span></div>
                    </div>
                </div>`;
            });
            cont.innerHTML = html;
        }

        function saveRoundResults() {
            if (!state.drawDone) return;

            document.querySelectorAll('#admin-matches-container .match-card').forEach(c => {
                const id = parseInt(c.getAttribute('data-id'));
                const hVal = c.querySelector('.h-in').value;
                const aVal = c.querySelector('.a-in').value;
                
                let m = state.fixtures.find(x => x.id === id);
                if (m) {
                    if (hVal !== '' && aVal !== '') {
                        m.homeScore = parseInt(hVal); 
                        m.awayScore = parseInt(aVal);
                    } else {
                        m.homeScore = ""; 
                        m.awayScore = "";
                    }
                }
            });

            SyncEngine.save(); 
            
            const btn = document.getElementById('save-btn');
            const txt = btn.innerText;
            btn.innerText = "تم حفظ وتزامن النتائج ✅";
            btn.style.background = "linear-gradient(135deg, #00c853, #00e676)";
            btn.style.color = "#000";
            setTimeout(() => { 
                btn.innerText = txt; 
                btn.style.background = ""; 
            }, 2500);
        }

        window.onload = init;
    </script>
</body>
</html>
