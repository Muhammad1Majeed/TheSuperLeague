<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="referrer" content="no-referrer">

<title>Shabakaty Player</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.13/shaka-player.compiled.js"></script>

<style>

:root {
    --primary-color: #ffc107;
    --live-color: #e62e2e;
    --not-live-color: rgba(128,128,128,.8);
    --menu-bg: rgba(25,25,25,.95);
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: 'Tajawal', sans-serif !important;
    -webkit-tap-highlight-color: transparent;
}

#player-container {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
}

#video-wrapper {
    position: relative;
    width: 100%;
    height: 100%;
    z-index: 1;
}

#video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
}

#loading-spinner {
    position: absolute;
    z-index: 100;
    width: 50px;
    height: 50px;
    border: 5px solid rgba(255,255,255,.2);
    border-top-color: var(--primary-color);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    display: none;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

#error-overlay {
    position: absolute;
    inset: 0;
    z-index: 100;
    background: rgba(0,0,0,.92);
    color: #fff;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    padding: 20px;
}

#error-overlay svg {
    width: 48px;
    height: 48px;
    margin-bottom: 20px;
    color: #e62e2e;
}

#error-overlay h3 {
    margin: 0 0 10px;
}

#error-overlay p {
    max-width: 500px;
    line-height: 1.7;
    color: #ccc;
}

#error-retry-btn {
    margin-top: 15px;
    padding: 10px 22px;
    border: 0;
    border-radius: 8px;
    background: var(--primary-color);
    color: #000;
    font-family: inherit;
    font-weight: 700;
    cursor: pointer;
}

.controls-overlay {
    transition:
        opacity .3s,
        visibility .3s;

    opacity: 0;
    visibility: hidden;
    pointer-events: none;

    position: absolute;
    z-index: 10;
}

.controls-overlay.visible {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
}

#bottom-controls-container {
    bottom: 0;
    left: 0;
    right: 0;
    padding: 5px 15px;
    background: linear-gradient(
        to top,
        rgba(0,0,0,.85),
        transparent
    );
}

#center-controls {
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    display: flex;
    align-items: center;
    gap: 30px;
}

.control-button,
.center-control-button {
    background: none;
    border: none;
    color: #fff;
    cursor: pointer;
    padding: 0;
    outline: none;
    -webkit-tap-highlight-color: transparent;
}

.control-button:hover {
    color: var(--primary-color);
}

.control-button svg,
.control-button i {
    width: 22px;
    height: 22px;
}

.center-control-button {
    width: 70px;
    height: 70px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.center-control-button svg,
.center-control-button i {
    width: 48px;
    height: 48px;
    filter: drop-shadow(
        0 0 8px rgba(0,0,0,.8)
    );
}

#seek-backward-center-btn svg {
    transform: scaleX(-1);
}

.progress-bar-container {
    width: 100%;
    padding: 10px 0;
    cursor: pointer;
}

.progress-bar {
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,.3);
    border-radius: 2px;
}

.progress-played {
    width: 0;
    height: 100%;
    background: var(--primary-color);
    border-radius: 2px;
}

.bottom-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 5px;
}

.controls-left,
.controls-right {
    display: flex;
    align-items: center;
    gap: 15px;
}

#live-indicator {
    font-weight: 700;
    font-size: .9rem;
    letter-spacing: .5px;
    padding: 4px 10px;
    border-radius: 50px;
    color: #fff;
    white-space: nowrap;
}

#live-indicator.is-live {
    background: var(--live-color);
}

#live-indicator.is-not-live {
    background: var(--not-live-color);
    cursor: pointer;
}

.popup-menu {
    position: absolute;
    bottom: 60px;
    width: 200px;
    background: var(--menu-bg);
    backdrop-filter: blur(8px);
    border-radius: 8px;
    z-index: 20;
    max-height: 220px;
    overflow-y: auto;
    display: none;
    box-shadow: 0 8px 30px rgba(0,0,0,.45);
}

.popup-menu-list {
    list-style: none;
    padding: 5px;
    margin: 0;
}

.menu-item {
    display: flex;
    justify-content: space-between;
    padding: 8px 10px;
    border-radius: 5px;
    cursor: pointer;
    font-weight: 500;
    color: #fff;
}

.menu-item:hover {
    background: rgba(255,255,255,.1);
}

.menu-item.active {
    color: var(--primary-color);
    font-weight: 700;
}

#player-logo {
    position: absolute;
    bottom: 75px;
    left: 15px;
    z-index: 9;
    opacity: .7;
    height: 28px;
    display: inline-block;
}

#player-logo img {
    height: 100%;
    width: auto;
}

@media(max-width:600px) {

    #center-controls {
        gap: 10px;
    }

    .center-control-button {
        width: 60px;
        height: 60px;
    }

    .center-control-button svg,
    .center-control-button i {
        width: 40px;
        height: 40px;
    }

    .controls-left,
    .controls-right {
        gap: 10px;
    }

    .popup-menu {
        width: 180px;
    }
}

</style>
</head>

<body>

<div id="player-container">

    <div id="loading-spinner"></div>

    <div id="error-overlay">

        <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round">

            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
            <line x1="12" y1="9" x2="12" y2="13"/>
            <line x1="12" y1="17" x2="12.01" y2="17"/>

        </svg>

        <h3 id="error-title">
            فشل تحميل البث
        </h3>

        <p id="error-message">
            تعذر تشغيل البث.
        </p>

        <button id="error-retry-btn">
            إعادة المحاولة
        </button>

    </div>

    <div id="video-wrapper">

        <video
            id="video"
            autoplay
            muted
            playsinline
            preload="auto">
        </video>

    </div>

    <a
        id="player-logo"
        target="_blank"
        href="https://t.me/bestvapp">

        <img
            alt="Logo"
            src="http://ko.best-goal.live/app/logo.png">

    </a>

    <div
        id="quality-popup"
        class="popup-menu">

        <ul
            id="quality-list"
            class="popup-menu-list">
        </ul>

    </div>

    <div
        id="audio-popup"
        class="popup-menu">

        <ul
            id="audio-list"
            class="popup-menu-list">
        </ul>

    </div>

    <div
        id="center-controls"
        class="controls-overlay visible">

        <button
            class="center-control-button"
            id="seek-backward-center-btn"
            title="تقديم 10 ثواني">

            <i data-feather="fast-forward"></i>

        </button>

        <button
            class="center-control-button"
            id="play-pause-center-btn"
            title="تشغيل/إيقاف">

            <i data-feather="pause"></i>

        </button>

        <button
            class="center-control-button"
            id="seek-forward-center-btn"
            title="رجوع 10 ثواني">

            <i data-feather="rewind"></i>

        </button>

    </div>

    <div
        id="bottom-controls-container"
        class="controls-overlay visible">

        <div class="progress-bar-container">

            <div class="progress-bar">

                <div
                    class="progress-played">
                </div>

            </div>

        </div>

        <div class="bottom-controls">

            <div class="controls-left">

                <button
                    class="control-button"
                    id="play-pause-btn"
                    title="تشغيل/إيقاف">

                    <i data-feather="pause"></i>

                </button>

                <button
                    class="control-button"
                    id="mute-btn"
                    title="كتم الصوت">

                    <i data-feather="volume-2"></i>

                </button>

                <button
                    id="quality-btn"
                    class="control-button"
                    title="الجودة">

                    <i data-feather="settings"></i>

                </button>

                <button
                    id="audio-btn"
                    class="control-button"
                    title="الصوت">

                    <i data-feather="headphones"></i>

                </button>

                <div
                    id="live-indicator"
                    class="is-live">

                    ● مباشر

                </div>

            </div>

            <div class="controls-right">

                <button
                    class="control-button"
                    id="pip-btn"
                    title="نافذة ضمن نافذة">

                    <i data-feather="airplay"></i>

                </button>

                <button
                    class="control-button"
                    id="expand-btn"
                    title="تغيير وضع العرض">

                    <i data-feather="maximize"></i>

                </button>

                <button
                    class="control-button"
                    id="fullscreen-btn"
                    title="ملء الشاشة">

                    <i data-feather="maximize-2"></i>

                </button>

            </div>

        </div>

    </div>

</div>

<script>

document.addEventListener('DOMContentLoaded', async () => {

    /*
     * ==========================================
     * رابط البث المباشر
     * ==========================================
     */

    const STREAM_URL =
        'https://akamai-live.servers8.com/eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiJQNjg5Nmx4MGFJVTFGdFF0UjlzWGViZG5FYjkyIiwiY2hhbm5lbE5hbWUiOiJjaDAxLWZ0YSIsImlwIjoiMjA5LjE5OC4xMzIuNzEiLCJpcF92NCI6IjIwOS4xOTguMTMyLjcxIiwiaXBfdjYiOiIiLCJ1c2VyQWdlbnQiOiJNb3ppbGxhLzUuMCAoV2luZG93cyBOVCAxMC4wOyBXaW42NDsgeDY0OyBydjoxNTQuMCkgR2Vja28vMjAxMDAxMDEgRmlyZWZveC8xNTQuMCIsImhhc1N1YnNjcmlwdGlvbnMiOmZhbHNlLCJuYmYiOjE3ODc2NzY3ODIsImV4cCI6MTc4NzcyMzY0MiwiZ2VvQnlwYXNzIjpmYWxzZSwiaWF0IjoxNzg3Njc2ODQyfQ.Vhf1znaDmQ-R2dkv7URo9K08c8FszsI76sMvLpyMaV8/live/ch01-fta/index.m3u8';


    /*
     * ==========================================
     * الإعدادات
     * ==========================================
     */

    const MAX_RETRIES = 5;

    const RETRY_DELAY_MS = 1500;

    let controlsTimeout;

    let clickTimer;

    let expandModeIndex = 0;

    const expandModes = [
        'contain',
        'cover',
        'fill'
    ];


    /*
     * ==========================================
     * العناصر
     * ==========================================
     */

    const elements = {

        video:
            document.getElementById('video'),

        playerContainer:
            document.getElementById('player-container'),

        videoWrapper:
            document.getElementById('video-wrapper'),

        centerControls:
            document.getElementById('center-controls'),

        bottomControls:
            document.getElementById(
                'bottom-controls-container'
            ),

        playPauseBtn:
            document.getElementById(
                'play-pause-btn'
            ),

        playPauseCenterBtn:
            document.getElementById(
                'play-pause-center-btn'
            ),

        muteBtn:
            document.getElementById(
                'mute-btn'
            ),

        pipBtn:
            document.getElementById(
                'pip-btn'
            ),

        expandBtn:
            document.getElementById(
                'expand-btn'
            ),

        fullscreenBtn:
            document.getElementById(
                'fullscreen-btn'
            ),

        liveIndicator:
            document.getElementById(
                'live-indicator'
            ),

        progressPlayed:
            document.querySelector(
                '.progress-played'
            ),

        progressBarContainer:
            document.querySelector(
                '.progress-bar-container'
            ),

        qualityBtn:
            document.getElementById(
                'quality-btn'
            ),

        audioBtn:
            document.getElementById(
                'audio-btn'
            ),

        qualityPopup:
            document.getElementById(
                'quality-popup'
            ),

        audioPopup:
            document.getElementById(
                'audio-popup'
            ),

        loadingSpinner:
            document.getElementById(
                'loading-spinner'
            ),

        errorOverlay:
            document.getElementById(
                'error-overlay'
            ),

        errorTitle:
            document.getElementById(
                'error-title'
            ),

        errorMessage:
            document.getElementById(
                'error-message'
            ),

        retryBtn:
            document.getElementById(
                'error-retry-btn'
            ),

        playerLogoLink:
            document.getElementById(
                'player-logo'
            )

    };


    /*
     * ==========================================
     * تهيئة Shaka Player
     * ==========================================
     */

    shaka.polyfill.installAll();

    if (!shaka.Player.isBrowserSupported()) {

        showError(
            'المتصفح غير مدعوم',
            'هذا المتصفح لا يدعم تشغيل البث المطلوب.'
        );

        return;
    }

    const player =
        new shaka.Player(
            elements.video
        );


    /*
     * ==========================================
     * إعدادات المشغل
     * ==========================================
     */

    player.configure({

        manifest: {

            dash: {
                ignoreMinBufferTime: true
            },

            hls: {
                ignoreTextStreamFailures: true
            }

        },

        streaming: {

            rebufferingGoal: 2,

            bufferingGoal: 10,

            bufferBehind: 30,

            retryParameters: {

                maxAttempts: 4,

                baseDelay: 500,

                backoffFactor: 1.5,

                fuzzFactor: .5,

                timeout: 10000

            }

        },

        abr: {

            enabled: true,

            defaultBandwidthEstimate: 3000000

        }

    });


    /*
     * ==========================================
     * إظهار الخطأ
     * ==========================================
     */

    function showError(
        title,
        message
    ) {

        elements.loadingSpinner.style.display =
            'none';

        elements.errorTitle.textContent =
            title;

        elements.errorMessage.textContent =
            message;

        elements.errorOverlay.style.display =
            'flex';

        feather.replace();

    }


    /*
     * ==========================================
     * إخفاء الخطأ
     * ==========================================
     */

    function hideError() {

        elements.errorOverlay.style.display =
            'none';

    }


    /*
     * ==========================================
     * تحميل البث
     * ==========================================
     */

    async function initializeApp() {

        hideError();

        elements.loadingSpinner.style.display =
            'flex';

        for (
            let attempt = 1;
            attempt <= MAX_RETRIES;
            attempt++
        ) {

            try {

                console.log(
                    `[INFO] Loading stream. Attempt ${attempt}`
                );

                /*
                 * في كل محاولة نعيد تحميل الرابط
                 */

                await player.load(
                    STREAM_URL
                );

                console.log(
                    '[SUCCESS] Stream loaded successfully.'
                );

                elements.loadingSpinner.style.display =
                    'none';

                showControls();

                updatePlayButton();

                populateQualityMenu();

                populateAudioMenu();

                /*
                 * محاولة التشغيل التلقائي
                 */

                try {

                    await elements.video.play();

                } catch (autoplayError) {

                    console.warn(
                        '[WARN] Autoplay blocked:',
                        autoplayError
                    );

                }

                return;

            } catch (error) {

                console.warn(
                    `[WARN] Attempt ${attempt} failed:`,
                    error
                );

                if (
                    attempt === MAX_RETRIES
                ) {

                    console.error(
                        '[FATAL] All attempts failed.',
                        error
                    );

                    showError(
                        'فشل تحميل البث',
                        'تعذر تشغيل البث. قد يكون الرابط منتهي الصلاحية أو أن الخادم يمنع التشغيل من هذا الموقع.'
                    );

                    return;

                }

                await new Promise(
                    resolve =>
                        setTimeout(
                            resolve,
                            RETRY_DELAY_MS
                        )
                );

            }

        }

    }


    /*
     * ==========================================
     * التحكم بالمشغل
     * ==========================================
     */

    function showControls() {

        [
            elements.bottomControls,
            elements.centerControls
        ].forEach(
            el =>
                el.classList.add(
                    'visible'
                )
        );

        clearTimeout(
            controlsTimeout
        );

        if (
            !elements.video.paused
        ) {

            controlsTimeout =
                setTimeout(
                    hideControls,
                    3000
                );

        }

    }


    function hideControls() {

        if (
            document.fullscreenElement &&
            elements.video.paused
        ) {

            return;

        }

        [
            elements.bottomControls,
            elements.centerControls
        ].forEach(
            el =>
                el.classList.remove(
                    'visible'
                )
        );

        elements.qualityPopup.style.display =
            'none';

        elements.audioPopup.style.display =
            'none';

    }


    function togglePlay() {

        if (
            elements.video.paused
        ) {

            elements.video.play()
                .catch(
                    error =>
                        console.warn(
                            'Play failed:',
                            error
                        )
                );

        } else {

            elements.video.pause();

        }

    }


    function updatePlayButton() {

        const icon =
            elements.video.paused
                ? 'play'
                : 'pause';

        elements.playPauseBtn.innerHTML =
            `<i data-feather="${icon}"></i>`;

        elements.playPauseCenterBtn.innerHTML =
            `<i data-feather="${icon}"></i>`;

        feather.replace();

    }


    /*
     * ==========================================
     * ملء الشاشة
     * ==========================================
     */

    async function toggleFullscreen() {

        try {

            if (
                !document.fullscreenElement
            ) {

                await elements.playerContainer
                    .requestFullscreen();

            } else {

                await document.exitFullscreen();

            }

        } catch (error) {

            console.warn(
                'Fullscreen error:',
                error
            );

        }

    }


    function updateFullscreenIcon() {

        elements.fullscreenBtn.innerHTML =
            `<i data-feather="${
                document.fullscreenElement
                    ? 'minimize-2'
                    : 'maximize-2'
            }"></i>`;

        feather.replace();

    }


    /*
     * ==========================================
     * القوائم المنبثقة
     * ==========================================
     */

    function togglePopup(
        button,
        popup,
        populator
    ) {

        const otherPopups = [
            elements.qualityPopup,
            elements.audioPopup
        ].filter(
            p => p !== popup
        );

        otherPopups.forEach(
            p =>
                p.style.display =
                    'none'
        );

        if (
            popup.style.display === 'block'
        ) {

            popup.style.display =
                'none';

            return;

        }

        if (populator) {

            populator();

        }

        const containerRect =
            elements.playerContainer
                .getBoundingClientRect();

        const buttonRect =
            button.getBoundingClientRect();

        const popupWidth =
            popup.offsetWidth || 200;

        const buttonCenter =
            (
                buttonRect.left -
                containerRect.left
            ) +
            (
                buttonRect.width / 2
            );

        let popupLeft =
            buttonCenter -
            (
                popupWidth / 2
            );

        if (
            popupLeft < 10
        ) {

            popupLeft = 10;

        }

        if (
            popupLeft +
            popupWidth >
            containerRect.width - 10
        ) {

            popupLeft =
                containerRect.width -
                popupWidth -
                10;

        }

        popup.style.left =
            `${popupLeft}px`;

        popup.style.display =
            'block';

    }


    /*
     * ==========================================
     * الجودة
     * ==========================================
     */

    function populateQualityMenu() {

        const list =
            document.getElementById(
                'quality-list'
            );

        list.innerHTML = '';

        const tracks =
            player.getVariantTracks();

        if (!tracks.length) {

            const item =
                document.createElement(
                    'li'
                );

            item.className =
                'menu-item active';

            item.textContent =
                'تلقائي';

            list.appendChild(item);

            return;

        }

        const config =
            player.getConfiguration();

        const isAbrEnabled =
            config.abr.enabled;

        const activeTrack =
            tracks.find(
                t => t.active
            );

        const auto =
            document.createElement(
                'li'
            );

        auto.className =
            `menu-item ${
                isAbrEnabled
                    ? 'active'
                    : ''
            }`;

        auto.textContent =
            'تلقائي';

        auto.onclick = () => {

            player.configure(
                'abr.enabled',
                true
            );

            togglePopup(
                elements.qualityBtn,
                elements.qualityPopup
            );

        };

        list.appendChild(
            auto
        );

        const heights = [
            ...new Set(
                tracks
                    .map(
                        t => t.height
                    )
                    .filter(Boolean)
            )
        ].sort(
            (a,b) => b-a
        );

        heights.forEach(
            height => {

                const track =
                    tracks.find(
                        t =>
                            t.height ===
                            height
                    );

                if (!track) {
                    return;
                }

                const item =
                    document.createElement(
                        'li'
                    );

                item.className =
                    `menu-item ${
                        !isAbrEnabled &&
                        activeTrack &&
                        activeTrack.height ===
                        height
                            ? 'active'
                            : ''
                    }`;

                item.textContent =
                    `${height}p`;

                item.onclick = () => {

                    player.configure(
                        'abr.enabled',
                        false
                    );

                    player.selectVariantTrack(
                        track,
                        true
                    );

                    togglePopup(
                        elements.qualityBtn,
                        elements.qualityPopup
                    );

                };

                list.appendChild(
                    item
                );

            }
        );

    }


    /*
     * ==========================================
     * المسارات الصوتية
     * ==========================================
     */

    function populateAudioMenu() {

        const list =
            document.getElementById(
                'audio-list'
            );

        list.innerHTML = '';

        const audioTracks =
            player.getAudioLanguagesAndRoles();

        if (
            !audioTracks ||
            !audioTracks.length
        ) {

            const item =
                document.createElement(
                    'li'
                );

            item.className =
                'menu-item active';

            item.textContent =
                'الصوت الافتراضي';

            list.appendChild(
                item
            );

            return;

        }

        const currentLanguage =
            player.getAudioLanguages()[0];

        audioTracks.forEach(
            track => {

                const item =
                    document.createElement(
                        'li'
                    );

                item.className =
                    `menu-item ${
                        track.language ===
                        currentLanguage
                            ? 'active'
                            : ''
                    }`;

                item.textContent =
                    track.label ||
                    track.language ||
                    'Audio';

                item.onclick = () => {

                    player.selectAudioLanguage(
                        track.language,
                        track.role
                    );

                    togglePopup(
                        elements.audioBtn,
                        elements.audioPopup
                    );

                };

                list.appendChild(
                    item
                );

            }
        );

    }


    /*
     * ==========================================
     * التقدم والـ Live
     * ==========================================
     */

    function formatTime(
        seconds
    ) {

        if (
            isNaN(seconds) ||
            seconds < 0
        ) {

            return '00:00';

        }

        const date =
            new Date(null);

        date.setSeconds(
            seconds
        );

        const iso =
            date.toISOString();

        return seconds >= 3600
            ? iso.substr(11,8)
            : iso.substr(14,5);

    }


    elements.video.addEventListener(
        'timeupdate',
        () => {

            try {

                const range =
                    player.seekRange();

                if (
                    !isFinite(range.end)
                ) {

                    return;

                }

                if (
                    player.isLive()
                ) {

                    elements.liveIndicator
                        .style.display =
                        'inline-block';

                    const behind =
                        elements.video.paused ||
                        (
                            range.end -
                            elements.video.currentTime
                        ) > 15;

                    elements.liveIndicator.className =
                        behind
                            ? 'is-not-live'
                            : 'is-live';

                    elements.liveIndicator.innerHTML =
                        behind
                            ? '&#9679; متأخر'
                            : '&#9679; مباشر';

                } else if (
                    range.end > 0
                ) {

                    elements.liveIndicator
                        .style.display =
                        'inline-block';

                    elements.liveIndicator.className =
                        '';

                    elements.liveIndicator.style
                        .backgroundColor =
                        'transparent';

                    elements.liveIndicator.style
                        .cursor =
                        'default';

                    elements.liveIndicator.innerHTML =
                        `${formatTime(
                            elements.video.currentTime
                        )} / ${formatTime(
                            range.end
                        )}`;

                    const percentage =
                        (
                            (
                                elements.video.currentTime -
                                range.start
                            ) /
                            (
                                range.end -
                                range.start
                            )
                        ) * 100;

                    elements.progressPlayed.style.width =
                        `${Math.max(
                            0,
                            Math.min(
                                100,
                                percentage
                            )
                        )}%`;

                }

            } catch (error) {

                console.warn(
                    'Time update error:',
                    error
                );

            }

        }
    );


    /*
     * ==========================================
     * شريط التقدم
     * ==========================================
     */

    elements.progressBarContainer.addEventListener(
        'click',
        e => {

            if (
                player.isLive()
            ) {

                return;

            }

            const range =
                player.seekRange();

            const rect =
                elements.progressBarContainer
                    .getBoundingClientRect();

            const percentage =
                (
                    e.clientX -
                    rect.left
                ) /
                rect.width;

            elements.video.currentTime =
                range.start +
                percentage *
                (
                    range.end -
                    range.start
                );

        }
    );


    /*
     * ==========================================
     * أزرار التحكم
     * ==========================================
     */

    elements.playPauseBtn.addEventListener(
        'click',
        e => {

            e.stopPropagation();

            togglePlay();

        }
    );

    elements.playPauseCenterBtn.addEventListener(
        'click',
        e => {

            e.stopPropagation();

            togglePlay();

        }
    );


    document
        .getElementById(
            'seek-forward-center-btn'
        )
        .addEventListener(
            'click',
            e => {

                e.stopPropagation();

                elements.video.currentTime -=
                    10;

            }
        );


    document
        .getElementById(
            'seek-backward-center-btn'
        )
        .addEventListener(
            'click',
            e => {

                e.stopPropagation();

                elements.video.currentTime +=
                    10;

            }
        );


    elements.muteBtn.addEventListener(
        'click',
        e => {

            e.stopPropagation();

            elements.video.muted =
                !elements.video.muted;

        }
    );


    /*
     * ==========================================
     * Picture in Picture
     * ==========================================
     */

    elements.pipBtn.addEventListener(
        'click',
        async e => {

            e.stopPropagation();

            try {

                if (
                    document.pictureInPictureElement
                ) {

                    await document
                        .exitPictureInPicture();

                } else if (
                    document.pictureInPictureEnabled
                ) {

                    await elements.video
                        .requestPictureInPicture();

                }

            } catch (error) {

                console.warn(
                    'PiP error:',
                    error
                );

            }

        }
    );


    /*
     * ==========================================
     * تغيير طريقة عرض الفيديو
     * ==========================================
     */

    elements.expandBtn.addEventListener(
        'click',
        e => {

            e.stopPropagation();

            expandModeIndex =
                (
                    expandModeIndex + 1
                ) %
                expandModes.length;

            elements.video.style.objectFit =
                expandModes[
                    expandModeIndex
                ];

        }
    );


    /*
     * ==========================================
     * Fullscreen
     * ==========================================
     */

    elements.fullscreenBtn.addEventListener(
        'click',
        e => {

            e.stopPropagation();

            toggleFullscreen();

        }
    );


    document.addEventListener(
        'fullscreenchange',
        updateFullscreenIcon
    );


    /*
     * ==========================================
     * أزرار الجودة والصوت
     * ==========================================
     */

    elements.qualityBtn.addEventListener(
        'click',
        e => {

            e.stopPropagation();

            togglePopup(
                e.currentTarget,
                elements.qualityPopup,
                populateQualityMenu
            );

        }
    );


    elements.audioBtn.addEventListener(
        'click',
        e => {

            e.stopPropagation();

            togglePopup(
                e.currentTarget,
                elements.audioPopup,
                populateAudioMenu
            );

        }
    );


    /*
     * ==========================================
     * النقر على الفيديو
     * ==========================================
     */

    elements.videoWrapper.addEventListener(
        'click',
        e => {

            if (
                e.target !== elements.video &&
                e.target !== elements.videoWrapper
            ) {

                return;

            }

            clearTimeout(
                clickTimer
            );

            clickTimer =
                setTimeout(
                    () => {

                        if (
                            elements.bottomControls
                                .classList
                                .contains('visible')
                        ) {

                            hideControls();

                        } else {

                            showControls();

                        }

                    },
                    200
                );

        }
    );


    /*
     * ==========================================
     * Double Click
     * ==========================================
     */

    elements.video.addEventListener(
        'dblclick',
        async e => {

            e.stopPropagation();

            clearTimeout(
                clickTimer
            );

            await toggleFullscreen();

        }
    );


    /*
     * ==========================================
     * حركة الماوس
     * ==========================================
     */

    elements.playerContainer.addEventListener(
        'mousemove',
        showControls
    );

    elements.playerContainer.addEventListener(
        'touchstart',
        showControls,
        {
            passive: true
        }
    );


    /*
     * ==========================================
     * أحداث الفيديو
     * ==========================================
     */

    elements.video.addEventListener(
        'play',
        () => {

            updatePlayButton();

            showControls();

        }
    );


    elements.video.addEventListener(
        'pause',
        () => {

            updatePlayButton();

            showControls();

        }
    );


    elements.video.addEventListener(
        'volumechange',
        () => {

            elements.muteBtn.innerHTML =
                `<i data-feather="${
                    elements.video.muted ||
                    elements.video.volume === 0
                        ? 'volume-x'
                        : 'volume-2'
                }"></i>`;

            feather.replace();

        }
    );


    /*
     * ==========================================
     * الرجوع إلى Live
     * ==========================================
     */

    elements.liveIndicator.addEventListener(
        'click',
        e => {

            e.stopPropagation();

            if (
                elements.liveIndicator
                    .classList
                    .contains('is-not-live') &&
                player.isLive()
            ) {

                const range =
                    player.seekRange();

                elements.video.currentTime =
                    range.end;

            }

        }
    );


    /*
     * ==========================================
     * أخطاء Shaka
     * ==========================================
     */

    player.addEventListener(
        'error',
        event => {

            console.error(
                '[SHAKA ERROR]',
                event.detail
            );

            /*
             * لا نعرض الخطأ فوراً أثناء buffering
             * لأن Shaka قد يعيد الاتصال تلقائياً.
             */

        }
    );


    /*
     * ==========================================
     * تغيير المسارات
     * ==========================================
     */

    player.addEventListener(
        'trackschanged',
        () => {

            populateQualityMenu();

            populateAudioMenu();

        }
    );


    /*
     * ==========================================
     * Buffering
     * ==========================================
     */

    player.addEventListener(
        'buffering',
        event => {

            if (
                event.buffering
            ) {

                elements.loadingSpinner.style.display =
                    'flex';

            } else {

                elements.loadingSpinner.style.display =
                    'none';

            }

        }
    );


    /*
     * ==========================================
     * زر إعادة المحاولة
     * ==========================================
     */

    elements.retryBtn.addEventListener(
        'click',
        async () => {

            try {

                await player.unload();

            } catch (error) {}

            initializeApp();

        }
    );


    /*
     * ==========================================
     * بدء المشغل
     * ==========================================
     */

    feather.replace();

    await initializeApp();

});

</script>

</body>
</html>
