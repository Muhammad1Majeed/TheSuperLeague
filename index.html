<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بالتسعين | منصة رياضية عراقية</title>
    <meta name="description" content="بالتسعين — منصة رياضية بهوية عراقية تجمع أجواء الكرة العراقية وذكريات التسعينات مع تجربة مشاهدة رياضية حديثة.">
    <link rel="icon" href="https://h.top4top.io/p_3889g97e91.jpg">
    
    <!-- Google Fonts: Tajawal -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- Shaka Player UI CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.1/controls.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            900: '#050505',
                            800: '#111111',
                            accent: '#E50914'
                        }
                    },
                    fontFamily: {
                        sans: ['Tajawal', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #050505; color: white; -webkit-tap-highlight-color: transparent; }
        .glass-panel { background: rgba(17, 17, 17, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .loader { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid #E50914; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>

    <!-- React, ReactDOM, and Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Shaka Player -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.1/shaka-player.ui.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // ================= CONFIGURATION =================
        const CONFIG = {
            NAME: "بالتسعين",
            LOGO: "https://h.top4top.io/p_3889g97e91.jpg",
            M3U_SOURCE: "https://raw.githubusercontent.com/zezo81795-cell/IO/refs/heads/main/BEINSPORTS.M3U",
            ALWAN_BASE: "https://script1.tvkaidn.workers.dev/alwan",
            ALWAN_COUNT: 20
        };

        // ================= ICONS =================
        const Icons = {
            Search: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>,
            Play: () => <svg className="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>,
            Heart: ({ active }) => <svg className={`w-5 h-5 ${active ? 'text-red-500 fill-current' : 'text-gray-400'}`} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>,
            Back: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7"></path></svg>
        };

        // ================= SHAKA PLAYER COMPONENT =================
        function VideoPlayer({ channel, onBack }) {
            const videoRef = useRef(null);
            const containerRef = useRef(null);
            const [error, setError] = useState(null);

            useEffect(() => {
                shaka.polyfill.installAll();
                if (!shaka.Player.isBrowserSupported()) {
                    setError("متصفحك لا يدعم المشغل الحديث.");
                    return;
                }

                const player = new shaka.Player(videoRef.current);
                const ui = new shaka.ui.Overlay(player, containerRef.current, videoRef.current);
                
                // Advanced Streaming Configuration
                player.configure({
                    streaming: {
                        bufferingGoal: 30,
                        rebufferingGoal: 2,
                        retryParameters: { maxAttempts: 5, baseDelay: 1000, backoffFactor: 2 }
                    }
                });

                player.addEventListener('error', (e) => {
                    console.error('Player Error:', e);
                    setError("البث غير متاح حالياً. حاول مجدداً لاحقاً.");
                });

                player.load(channel.url).catch(() => {
                    setError("تعذر تحميل القناة. قد يكون البث متوقفاً من المصدر.");
                });

                return () => {
                    player.destroy();
                    ui.destroy();
                };
            }, [channel]);

            return (
                <div className="fixed inset-0 z-50 bg-black flex flex-col fade-in">
                    {/* Player Header */}
                    <div className="absolute top-0 w-full z-10 p-4 bg-gradient-to-b from-black/90 to-transparent flex items-center gap-4">
                        <button onClick={onBack} className="p-2 bg-white/10 hover:bg-white/20 rounded-full transition">
                            <Icons.Back />
                        </button>
                        <div className="flex items-center gap-3">
                            <img src={channel.logo || CONFIG.LOGO} alt="logo" className="w-10 h-10 object-contain rounded bg-white/5 p-1" />
                            <div>
                                <h2 className="font-bold text-lg">{channel.name}</h2>
                                <div className="flex items-center gap-2 text-xs">
                                    <span className="w-2 h-2 bg-red-600 rounded-full animate-pulse"></span>
                                    مباشر
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Video Container */}
                    <div ref={containerRef} className="w-full h-full relative">
                        {error && (
                            <div className="absolute inset-0 flex items-center justify-center bg-black z-20">
                                <div className="text-center p-6 glass-panel rounded-xl">
                                    <p className="text-xl mb-4">{error}</p>
                                    <button onClick={() => window.location.reload()} className="px-6 py-2 bg-brand-accent rounded-full font-bold">تحديث</button>
                                </div>
                            </div>
                        )}
                        <video ref={videoRef} className="w-full h-full" autoPlay playsInline></video>
                    </div>
                </div>
            );
        }

        // ================= MAIN APP COMPONENT =================
        function App() {
            const [channels, setChannels] = useState([]);
            const [loading, setLoading] = useState(true);
            const [activeChannel, setActiveChannel] = useState(null);
            const [search, setSearch] = useState('');
            const [activeCategory, setActiveCategory] = useState('الكل');
            const [favorites, setFavorites] = useState([]);
            const [showFavorites, setShowFavorites] = useState(false);

            // Load Favorites
            useEffect(() => {
                const saved = localStorage.getItem('90s_favorites');
                if (saved) setFavorites(JSON.parse(saved));
            }, []);

            const toggleFav = (e, id) => {
                e.stopPropagation();
                let newFavs = favorites.includes(id) ? favorites.filter(f => f !== id) : [...favorites, id];
                setFavorites(newFavs);
                localStorage.setItem('90s_favorites', JSON.stringify(newFavs));
            };

            // Fetch & Parse Channels
            useEffect(() => {
                const fetchChannels = async () => {
                    try {
                        let parsedChannels = [];
                        
                        // 1. Fetch M3U
                        try {
                            const res = await fetch(CONFIG.M3U_SOURCE);
                            const text = await res.text();
                            const lines = text.split('\n');
                            let current = {};
                            
                            lines.forEach(line => {
                                line = line.trim();
                                if (line.startsWith('#EXTINF')) {
                                    const tvgLogo = line.match(/tvg-logo="([^"]+)"/);
                                    const group = line.match(/group-title="([^"]+)"/);
                                    const name = line.split(',')[1];
                                    current = {
                                        name: name ? name.trim() : 'قناة',
                                        logo: tvgLogo ? tvgLogo[1] : null,
                                        group: group ? group[1] : 'عام'
                                    };
                                } else if (line.startsWith('http')) {
                                    if (current.name) {
                                        current.url = line;
                                        current.id = btoa(line).substring(0, 15);
                                        parsedChannels.push(current);
                                        current = {};
                                    }
                                }
                            });
                        } catch (err) {
                            console.warn("M3U Fetch Error (CORS or Network):", err);
                        }

                        // 2. Generate Alwan Channels
                        const alwanChannels = Array.from({ length: CONFIG.ALWAN_COUNT }).map((_, i) => ({
                            id: `alwan_${i+1}`,
                            name: `ألوان ${i+1}`,
                            group: 'ألوان',
                            logo: CONFIG.LOGO,
                            url: `${CONFIG.ALWAN_BASE}${i+1}.m3u8`
                        }));

                        // 3. Merge and deduplicate
                        const all = [...parsedChannels, ...alwanChannels];
                        const unique = Array.from(new Map(all.map(item => [item.url, item])).values());
                        
                        setChannels(unique);
                    } catch (error) {
                        console.error("Global Fetch Error", error);
                    } finally {
                        setLoading(false);
                    }
                };
                fetchChannels();
            }, []);

            const categories = ['الكل', 'المفضلة', ...new Set(channels.map(c => c.group))];

            const filteredChannels = useMemo(() => {
                return channels.filter(c => {
                    const matchesSearch = c.name.toLowerCase().includes(search.toLowerCase());
                    const matchesCat = activeCategory === 'الكل' || c.group === activeCategory;
                    const matchesFav = activeCategory === 'المفضلة' ? favorites.includes(c.id) : true;
                    return matchesSearch && matchesCat && matchesFav;
                });
            }, [channels, search, activeCategory, favorites]);

            if (loading) {
                return (
                    <div className="h-screen flex flex-col items-center justify-center bg-brand-900 fade-in">
                        <img src={CONFIG.LOGO} alt="Logo" className="w-32 h-32 mb-8 rounded-2xl shadow-[0_0_30px_rgba(229,9,20,0.3)] animate-pulse" />
                        <div className="loader mb-4"></div>
                        <h2 className="text-xl font-bold text-gray-300">جاري تحميل المنصة...</h2>
                    </div>
                );
            }

            if (activeChannel) {
                return <VideoPlayer channel={activeChannel} onBack={() => setActiveChannel(null)} />;
            }

            return (
                <div className="min-h-screen pb-20 bg-brand-900 fade-in">
                    {/* Header */}
                    <header className="sticky top-0 z-30 glass-panel border-b-0 border-white/10">
                        <div className="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
                            <div className="flex items-center gap-4 cursor-pointer" onClick={() => window.location.reload()}>
                                <img src={CONFIG.LOGO} className="w-12 h-12 rounded-lg shadow-lg" alt="Logo" />
                                <h1 className="text-2xl font-black tracking-tight">{CONFIG.NAME}</h1>
                            </div>
                            <div className="hidden md:flex relative w-96">
                                <input 
                                    type="text" 
                                    placeholder="ابحث عن قناة أو بطولة..." 
                                    value={search}
                                    onChange={(e) => setSearch(e.target.value)}
                                    className="w-full bg-brand-800 border border-white/10 rounded-full py-2.5 px-6 pr-12 text-sm focus:outline-none focus:border-brand-accent transition-colors"
                                />
                                <div className="absolute right-4 top-3 text-gray-400"><Icons.Search /></div>
                            </div>
                        </div>
                    </header>

                    {/* Hero Section */}
                    {!search && activeCategory === 'الكل' && (
                        <section className="relative w-full h-[40vh] flex items-center justify-center overflow-hidden border-b border-white/5">
                            <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-brand-800 to-brand-900"></div>
                            <div className="relative z-10 text-center px-4 space-y-4">
                                <h2 className="text-4xl md:text-6xl font-black bg-clip-text text-transparent bg-gradient-to-r from-white to-gray-500">
                                    ذكريات الكرة العراقية... بروح اليوم
                                </h2>
                                <p className="text-gray-400 text-lg">أفضل القنوات الرياضية وألوان في مكان واحد.</p>
                            </div>
                        </section>
                    )}

                    <main className="max-w-7xl mx-auto px-4 py-8">
                        {/* Mobile Search */}
                        <div className="md:hidden relative mb-6">
                            <input 
                                type="text" 
                                placeholder="ابحث..." 
                                value={search}
                                onChange={(e) => setSearch(e.target.value)}
                                className="w-full bg-brand-800 border border-white/10 rounded-xl py-3 px-4 pr-10 text-sm focus:outline-none focus:border-brand-accent"
                            />
                            <div className="absolute right-3 top-3 text-gray-400"><Icons.Search /></div>
                        </div>

                        {/* Categories List */}
                        <div className="flex overflow-x-auto hide-scroll gap-3 mb-8 pb-2">
                            {categories.map((cat, i) => (
                                <button 
                                    key={i}
                                    onClick={() => setActiveCategory(cat)}
                                    className={`whitespace-nowrap px-6 py-2 rounded-full text-sm font-bold transition-all ${activeCategory === cat ? 'bg-brand-accent text-white shadow-[0_0_15px_rgba(229,9,20,0.4)]' : 'bg-brand-800 text-gray-400 hover:bg-white/10'}`}
                                >
                                    {cat}
                                </button>
                            ))}
                        </div>

                        {/* Channels Grid */}
                        {filteredChannels.length === 0 ? (
                            <div className="text-center py-20 text-gray-500">لا توجد قنوات مطابقة للبحث.</div>
                        ) : (
                            <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4">
                                {filteredChannels.map(channel => (
                                    <div 
                                        key={channel.id} 
                                        onClick={() => setActiveChannel(channel)}
                                        className="group relative bg-brand-800 border border-white/5 rounded-2xl p-4 hover:border-brand-accent/50 cursor-pointer transition-all duration-300 hover:-translate-y-1 overflow-hidden"
                                    >
                                        <div className="absolute top-3 right-3 z-10 flex gap-2">
                                            <div className="bg-black/60 backdrop-blur-md px-2 py-1 rounded-md flex items-center gap-1.5 text-[10px] font-bold">
                                                <span className="w-1.5 h-1.5 bg-red-500 rounded-full animate-pulse"></span>
                                                مباشر
                                            </div>
                                        </div>
                                        
                                        <div className="absolute top-3 left-3 z-10">
                                            <button onClick={(e) => toggleFav(e, channel.id)} className="bg-black/60 p-1.5 rounded-full hover:bg-black">
                                                <Icons.Heart active={favorites.includes(channel.id)} />
                                            </button>
                                        </div>

                                        <div className="aspect-square relative flex items-center justify-center bg-black/30 rounded-xl mb-4 group-hover:bg-black/50 transition-colors">
                                            <img 
                                                src={channel.logo || CONFIG.LOGO} 
                                                onError={(e) => e.target.src = CONFIG.LOGO}
                                                alt={channel.name} 
                                                className="w-20 h-20 object-contain drop-shadow-xl group-hover:scale-110 transition-transform duration-300" 
                                            />
                                            <div className="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity bg-black/40 rounded-xl">
                                                <div className="bg-brand-accent p-3 rounded-full shadow-[0_0_15px_rgba(229,9,20,0.8)] text-white transform scale-50 group-hover:scale-100 transition-transform duration-300">
                                                    <Icons.Play />
                                                </div>
                                            </div>
                                        </div>
                                        <h3 className="font-bold text-sm text-gray-100 truncate text-center">{channel.name}</h3>
                                        <p className="text-xs text-gray-500 mt-1 text-center truncate">{channel.group}</p>
                                    </div>
                                ))}
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
