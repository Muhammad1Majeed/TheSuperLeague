function _0xenc(s){return btoa(unescape(encodeURIComponent(s))).split('').reverse().join('');}
function _0xdec(s){try{return decodeURIComponent(escape(atob(s.split('').reverse().join(''))));}catch(e){return '';}}

// دالة ذكية تفك كل أنواع التشفير: المعكوس + العادي Base64
function smartDecode(str){
    if(!str) return '';
    str=str.trim();
    // إذا كان يبدأ بـ = فهو تشفير معكوس
    if(str.startsWith('=') || str.startsWith('==')){
        const d=_0xdec(str);
        if(d && d.startsWith('http')) return d;
    }
    // إذا كان Base64 عادي مثل aHR0c...
    if(str.startsWith('aHR0')){
        try{ return atob(str); }catch(e){}
    }
    // إذا كان نص عادي http
    if(str.startsWith('http')) return str;
    // جرب فك معكوس
    try{
        const d=_0xdec(str);
        if(d) return d;
    }catch(e){}
    // جرب Base64 عادي
    try{
        const d=atob(str);
        if(d) return d;
    }catch(e){}
    return str;
}

    if(passInput.value.trim()==='2626'){
        sessionStorage.setItem('_auth','ok');
        loginOverlay.style.display='none';
        mainSite.classList.add('unlocked');

    const expandSvg=`<svg fill="currentColor" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 100 100"><path d="M22.6 20.5H36c1.1 0 2-.9 2-2s-.9-2-2-2H19c-1.1 0-2.5 1.2-2.5 2.4v17c0 1.1.9 2 2 2s2-.9 2-2V24.9l16 15.8c.4.4 1 .6 1.5.6s1.1-.2 1.5-.6c.8-.8.8-2.2 0-3L22.6 20.5z"/><path d="M83 16.5H66c-1.1 0-2 .9-2 2s.9 2 2 2h12.6L61.6 37.6c-.8.8-.8 2.1 0 2.9.4.4.9.6 1.4.6s.8-.2 1.2-.6l16.3-16.5v11.7c0 1.1.9 2 2 2s2-.9 2-2v-17c0-1.1-.5-2.2-1.5-2.2z"/><path d="M36.5 61L20.5 76.8V65.9c0-1.1-.9-2-2-2s-2 .9-2 2v17c0 1.1 1.4 1.6 2.5 1.6h17c1.1 0 2-.9 2-2s-.9-2-2-2H22.5l17.1-15.9c.8-.8.7-2-.1-2.7-.8-.8-2.2-.7-3 .1z"/><path d="M82.5 63.9c-1.1 0-2 .9-2 2v11.6L64.2 61c-.8-.8-1.9-.8-2.7 0-.8.8-.7 1.9.1 2.6l17.2 16.9H66c-1.1 0-2 .9-2 2s.9 2 2 2h17c1.1 0 1.5-.5 1.5-1.6v-17c0-1.1-.9-2-2-2z"/></svg>`;
    elements.expandBtn.innerHTML=expandSvg; feather.replace();
    if(!shaka.Player.isBrowserSupported()) return;
    player=new shaka.Player(elements.video);
    player.configure({manifest:{dash:{ignoreMinBufferTime:true}},streaming:{rebufferingGoal:2,bufferingGoal:10,bufferBehind:30,retryParameters:{timeout:15000,maxAttempts:4,baseDelay:1000,backoffFactor:2}},abr:{enabled:true,defaultBandwidthEstimate:3000000}});

    window.openChannel=async function(channel){
        currentChannel=channel; currentServerIndex=0;
        elements.currentName.textContent=channel.f;
        document.getElementById('player-view').classList.add('visible');
        renderServers(channel);
        await loadServer(channel,0);
    };
    function renderServers(channel){
        elements.serversBar.innerHTML='';
        channel.s.forEach((srv,idx)=>{
            const btn=document.createElement('button'); btn.className='server-btn'+(idx===currentServerIndex?' active':''); btn.textContent=srv.n;
            btn.addEventListener('click',()=>{ currentServerIndex=idx; document.querySelectorAll('.server-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); loadServer(channel,idx); });
            elements.serversBar.appendChild(btn);
        });
    }
    async function loadServer(channel,idx){
        const srv=channel.s[idx]; if(!srv) return;
        // فك تشفير ذكي يدعم رابطك Base64 العادي + المشفر المعكوس + العادي
        let url, kid, key;
        if(srv.isB64){
            // رابطك الخاص - Base64 عادي + KID/KEY عادي
            try{ url=atob(srv.u); }catch(e){ url=srv.u; }
            kid=srv.k; key=srv.ky;
        }else{
            url=smartDecode(srv.u);
            kid=srv.k ? smartDecode(srv.k) : '';
            key=srv.ky ? smartDecode(srv.ky) : '';
        }
        console.log('Loading:', url, kid, key);
        elements.loadingSpinner.style.display='flex';
        elements.errorOverlay.style.display='none';
        try{
            if(kid&&key){ const ck={}; ck[kid]=key; player.configure({drm:{clearKeys:ck}}); } else { player.configure({drm:{clearKeys:{}}}); }

            await player.load(url);

            elements.centerControls.classList.add('visible');
            elements.bottomControls.classList.add('visible');
            setTimeout(()=>{ if(!elements.video.paused){ elements.centerControls.classList.remove('visible'); elements.bottomControls.classList.remove('visible'); } },3000);

            try{ await elements.video.play(); }catch(e){ elements.video.muted=true; await elements.video.play().catch(()=>{}); }

            elements.loadingSpinner.style.display='none';
            elements.errorOverlay.style.display='flex';
            elements.errorTitle.textContent='فشل تحميل البث';

    function showControls(){ [elements.bottomControls, elements.centerControls].forEach(el=>el.classList.add('visible')); clearTimeout(controlsTimeout); if(!elements.video.paused){ controlsTimeout=setTimeout(()=>{ [elements.bottomControls, elements.centerControls].forEach(el=>el.classList.remove('visible')); },3000); } }
    function hideControls(){ [elements.bottomControls, elements.centerControls].forEach(el=>el.classList.remove('visible')); }
    function togglePlay(){ if(elements.video.paused) elements.video.play().catch(()=>{}); else elements.video.pause(); }
    function updatePlayButton(){ const ic=elements.video.paused?'play':'pause'; elements.playPauseBtn.innerHTML=`<i data-feather="${ic}"></i>`; elements.playPauseCenterBtn.innerHTML=`<i data-feather="${ic}"></i>`; feather.replace(); }
    function updateVolumeIcon(){ const ic=elements.video.muted||elements.video.volume===0?'volume-x':'volume-2'; elements.muteBtn.innerHTML=`<i data-feather="${ic}"></i>`; feather.replace(); }
    async function toggleFullscreen(){ try{ if(!document.fullscreenElement) await elements.playerContainer.requestFullscreen(); else await document.exitFullscreen(); }catch(e){} }
    elements.backBtn.addEventListener('click', async()=>{ try{ await player.unload(); elements.video.pause(); }catch(e){} document.getElementById('player-view').classList.remove('visible'); if(document.fullscreenElement) try{ await document.exitFullscreen(); }catch(e){} });
    elements.retryBtn.addEventListener('click', ()=>{ if(!currentChannel) return; let nxt=(currentServerIndex+1)%currentChannel.s.length; currentServerIndex=nxt; renderServers(currentChannel); loadServer(currentChannel,nxt); });
    elements.playPauseBtn.addEventListener('click', e=>{ e.stopPropagation(); togglePlay(); });
    elements.playPauseCenterBtn.addEventListener('click', e=>{ e.stopPropagation(); togglePlay(); });
    elements.muteBtn.addEventListener('click', e=>{ e.stopPropagation(); elements.video.muted=!elements.video.muted; updateVolumeIcon(); });
    elements.qualityBtn.addEventListener('click', e=>{
        e.stopPropagation();
        const popup=elements.qualityPopup;
        if(popup.style.display==='block'){ popup.style.display='none'; return; }
        const list=document.getElementById('quality-list'); list.innerHTML='';
        const tracks=player.getVariantTracks(); const cfg=player.getConfiguration();
        const auto=document.createElement('li'); auto.className=`menu-item ${cfg.abr.enabled?'active':''}`; auto.textContent='تلقائي'; auto.onclick=()=>{ player.configure('abr.enabled',true); popup.style.display='none'; }; list.appendChild(auto);
        const hs=[...new Set(tracks.map(t=>t.height).filter(Boolean))].sort((a,b)=>b-a);
        hs.forEach(h=>{ const tr=tracks.find(x=>x.height===h); const li=document.createElement('li'); li.className='menu-item'; li.textContent=h+'p'; li.onclick=()=>{ player.configure('abr.enabled',false); player.selectVariantTrack(tr,true); popup.style.display='none'; }; list.appendChild(li); });
        popup.style.display='block';
    });
    elements.audioBtn.addEventListener('click', e=>{
        e.stopPropagation();
        const popup=elements.audioPopup;
        if(popup.style.display==='block'){ popup.style.display='none'; return; }
        const list=document.getElementById('audio-list'); list.innerHTML='';
        const audios=player.getAudioLanguagesAndRoles();
        audios.forEach(tr=>{ const li=document.createElement('li'); li.className='menu-item'; li.textContent=tr.label||tr.language||'الصوت'; li.onclick=()=>{ player.selectAudioLanguage(tr.language,tr.role); popup.style.display='none'; }; list.appendChild(li); });
        popup.style.display='block';
    });
    document.getElementById('seek-forward-center-btn').addEventListener('click', e=>{ e.stopPropagation(); elements.video.currentTime+=10; });
    document.getElementById('seek-backward-center-btn').addEventListener('click', e=>{ e.stopPropagation(); elements.video.currentTime-=10; });
    elements.fullscreenBtn.addEventListener('click', e=>{ e.stopPropagation(); toggleFullscreen(); });
    elements.videoWrapper.addEventListener('click', e=>{
        if(e.target!==elements.videoWrapper) return;
        clearTimeout(clickTimer);
        clickTimer=setTimeout(()=>{ if(elements.bottomControls.classList.contains('visible')){ elements.bottomControls.classList.remove('visible'); elements.centerControls.classList.remove('visible'); } else { elements.bottomControls.classList.add('visible'); elements.centerControls.classList.add('visible'); } },200);
    });
    elements.playerContainer.addEventListener('mousemove', ()=>{ elements.bottomControls.classList.add('visible'); elements.centerControls.classList.add('visible'); clearTimeout(controlsTimeout); controlsTimeout=setTimeout(()=>{ if(!elements.video.paused){ elements.bottomControls.classList.remove('visible'); elements.centerControls.classList.remove('visible'); } },3000); });
    elements.video.addEventListener('play', updatePlayButton);
    elements.video.addEventListener('pause', updatePlayButton);
    elements.video.addEventListener('volumechange', updateVolumeIcon);
}

if(sessionStorage.getItem('_auth')){
    loginOverlay.style.display='none';
    mainSite.classList.add('unlocked');
    mainSite.style.display='block';
    setTimeout(initSite, 100);
}
feather.replace();
</script>
