<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"
>

<meta
  name="referrer"
  content="no-referrer"
>

<title>بالتسعين</title>

<link
  href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap"
  rel="stylesheet"
>

<script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.13/shaka-player.compiled.js"></script>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background: #050505;
  color: #fff;
  font-family: "Tajawal", sans-serif;
}

body {
  overflow-x: hidden;
}

button,
input {
  font-family: inherit;
}

.header {
  position: sticky;
  top: 0;
  z-index: 1000;

  height: 72px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 25px;

  background:
    linear-gradient(
      180deg,
      rgba(12,12,12,.98),
      rgba(5,5,5,.95)
    );

  border-bottom:
    1px solid rgba(255,255,255,.07);

  backdrop-filter: blur(15px);
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;

  font-size: 23px;
  font-weight: 800;
}

.brand img {
  width: 44px;
  height: 44px;

  object-fit: cover;

  border-radius: 10px;
}

.search {
  width: min(420px,45vw);

  padding: 11px 16px;

  border-radius: 12px;

  border:
    1px solid rgba(255,255,255,.1);

  background:
    rgba(255,255,255,.06);

  color: white;

  outline: none;

  text-align: right;
}

.search:focus {
  border-color:
    rgba(255,193,7,.7);
}

.container {
  width: min(1400px,94%);

  margin: auto;

  padding:
    25px 0 50px;
}

.hero {
  min-height: 230px;

  border-radius: 22px;

  overflow: hidden;

  padding: 35px;

  margin-bottom: 25px;

  display: flex;

  align-items: center;

  background:

    radial-gradient(
      circle at 80% 20%,
      rgba(255,193,7,.18),
      transparent 35%
    ),

    linear-gradient(
      135deg,
      #171717,
      #070707
    );

  border:
    1px solid rgba(255,255,255,.08);
}

.hero h1 {
  margin: 0 0 10px;

  font-size:
    clamp(30px,5vw,55px);
}

.hero p {
  margin: 0;

  color: #aaa;

  font-size: 16px;
}

.section-title {
  display: flex;

  align-items: center;

  justify-content: space-between;

  margin: 30px 0 15px;

  font-size: 21px;

  font-weight: 800;
}

.channels {
  display: grid;

  grid-template-columns:
    repeat(
      auto-fill,
      minmax(180px,1fr)
    );

  gap: 14px;
}

.channel {
  position: relative;

  min-height: 120px;

  padding: 18px;

  border-radius: 17px;

  cursor: pointer;

  background:
    linear-gradient(
      145deg,
      #171717,
      #0b0b0b
    );

  border:
    1px solid rgba(255,255,255,.07);

  transition:
    transform .2s,
    border-color .2s,
    background .2s;
}

.channel:hover {
  transform:
    translateY(-3px);

  border-color:
    rgba(255,193,7,.5);

  background:
    linear-gradient(
      145deg,
      #202020,
      #0c0c0c
    );
}

.channel-number {
  position: absolute;

  top: 10px;
  left: 10px;

  font-size: 11px;

  color: #777;
}

.channel-logo {
  width: 55px;
  height: 55px;

  object-fit: contain;

  margin-bottom: 10px;

  display: block;
}

.channel-name {
  font-size: 15px;

  font-weight: 700;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}

.status {
  margin-top: 6px;

  font-size: 11px;

  color: #777;
}

.status.live {
  color: #4caf50;
}

.empty {
  padding: 50px;

  text-align: center;

  color: #777;
}

#player {
  position: fixed;

  inset: 0;

  z-index: 9999;

  display: none;

  background: #000;
}

#player.active {
  display: block;
}

#video {
  width: 100%;
  height: 100%;

  object-fit: contain;

  background: #000;
}

.player-top {
  position: absolute;

  top: 0;

  right: 0;
  left: 0;

  z-index: 20;

  padding: 18px;

  display: flex;

  align-items: center;

  justify-content: space-between;

  background:
    linear-gradient(
      #000c,
      transparent
    );
}

.player-title {
  font-size: 18px;

  font-weight: 700;
}

.player-close {
  width: 42px;
  height: 42px;

  border: 0;

  border-radius: 50%;

  background:
    #ffffff15;

  color: white;

  cursor: pointer;

  font-size: 18px;
}

.spinner {
  position: absolute;

  top: 50%;
  left: 50%;

  width: 48px;
  height: 48px;

  margin:
    -24px 0 0 -24px;

  border:
    4px solid #ffffff20;

  border-top-color:
    #ffc107;

  border-radius: 50%;

  animation:
    spin .8s linear infinite;

  display: none;

  z-index: 15;
}

.spinner.show {
  display: block;
}

@keyframes spin {
  to {
    transform:
      rotate(360deg);
  }
}

.player-error {
  position: absolute;

  inset: 0;

  z-index: 30;

  display: none;

  align-items: center;

  justify-content: center;

  flex-direction: column;

  text-align: center;

  padding: 25px;

  background:
    #000e;
}

.player-error.show {
  display: flex;
}

.player-error h2 {
  margin-bottom: 10px;
}

.player-error p {
  color: #aaa;

  max-width: 550px;

  line-height: 1.8;
}

.retry {
  border: 0;

  padding:
    11px 25px;

  border-radius: 10px;

  background:
    #ffc107;

  color:
    #000;

  font-weight:
    800;

  cursor:
    pointer;
}

@media(max-width:700px) {

  .header {
    padding:
      0 12px;
  }

  .brand {
    font-size:
      18px;
  }

  .brand img {
    width:
      38px;

    height:
      38px;
  }

  .search {
    width:
      48vw;
  }

  .hero {
    padding:
      25px;
  }

  .channels {
    grid-template-columns:
      repeat(2,1fr);
  }

}

</style>

</head>

<body>

<header class="header">

  <div class="brand">

    <img
      src="https://h.top4top.io/p_3889g97e91.jpg"
      alt="بالتسعين"
    >

    <span>
      بالتسعين
    </span>

  </div>

  <input
    id="search"
    class="search"
    type="search"
    placeholder="ابحث عن قناة..."
    autocomplete="off"
  >

</header>


<main class="container">

  <section class="hero">

    <div>

      <h1>
        بالتسعين
      </h1>

      <p>
        أجواء الكرة العراقية وذكريات التسعينات
        بهوية رياضية عراقية مختلفة.
      </p>

    </div>

  </section>


  <div class="section-title">

    <span>
      القنوات
    </span>

    <span
      id="channelCount"
      style="
        color:#777;
        font-size:13px
      "
    >
      0 قناة
    </span>

  </div>


  <section
    id="channels"
    class="channels"
  ></section>

</main>


<div id="player">

  <video
    id="video"
    playsinline
    autoplay
    muted
    preload="auto"
  ></video>


  <div class="player-top">

    <div
      id="playerTitle"
      class="player-title"
    >
      بالتسعين
    </div>

    <button
      id="closePlayer"
      class="player-close"
      aria-label="إغلاق"
    >
      ✕
    </button>

  </div>


  <div
    id="spinner"
    class="spinner"
  ></div>


  <div
    id="playerError"
    class="player-error"
  >

    <h2>
      تعذر تشغيل القناة
    </h2>

    <p id="errorText">
      حدث خطأ أثناء تحميل البث.
    </p>

    <button
      id="retry"
      class="retry"
    >
      إعادة المحاولة
    </button>

  </div>

</div>


<script>

"use strict";


/* ==========================================
   CONFIG
========================================== */

const CONFIG = {

  M3U_URL:
    "https://raw.githubusercontent.com/zezo81795-cell/IO/refs/heads/main/BEINSPORTS.M3U",

  ALWAN_COUNT:
    20,

  ALWAN_BASE:
    "https://script1.tvkaidn.workers.dev/alwan",

  PROXY_URL:
    "https://shabakaty.haldlym07.workers.dev"

};


/* ==========================================
   العناصر
========================================== */

const channelsEl =
  document.getElementById(
    "channels"
  );

const searchEl =
  document.getElementById(
    "search"
  );

const channelCountEl =
  document.getElementById(
    "channelCount"
  );

const playerEl =
  document.getElementById(
    "player"
  );

const video =
  document.getElementById(
    "video"
  );

const playerTitle =
  document.getElementById(
    "playerTitle"
  );

const spinner =
  document.getElementById(
    "spinner"
  );

const playerError =
  document.getElementById(
    "playerError"
  );

const errorText =
  document.getElementById(
    "errorText"
  );


let player = null;

let allChannels = [];

let currentChannel = null;


/* ==========================================
   Shaka
========================================== */

shaka.polyfill.installAll();


if (
  !shaka.Player.isBrowserSupported()
) {

  alert(
    "المتصفح لا يدعم تشغيل البث."
  );

}


player =
  new shaka.Player(video);


/* ==========================================
   إعداد المشغل
========================================== */

player.configure({

  streaming: {

    rebufferingGoal: 2,

    bufferingGoal: 10,

    bufferBehind: 30,

    retryParameters: {

      maxAttempts: 5,

      baseDelay: 500,

      backoffFactor: 1.5,

      fuzzFactor: .5,

      timeout: 10000

    }

  },

  abr: {

    enabled: true,

    defaultBandwidthEstimate:
      3000000

  },

  manifest: {

    dash: {

      ignoreMinBufferTime:
        true

    },

    hls: {

      ignoreTextStreamFailures:
        true

    }

  }

});


/* ==========================================
   Proxy
========================================== */

function proxyUrl(url) {

  if (!url) {
    return "";
  }

  const worker =
    CONFIG.PROXY_URL
      .replace(/\/+$/, "");

  /*
   * كل HTTP يمر عبر Worker
   */

  if (
    url
      .toLowerCase()
      .startsWith("http://")
  ) {

    return (
      worker +
      "/proxy?url=" +
      encodeURIComponent(url)
    );

  }

  /*
   * M3U8 HTTPS المباشر
   */

  if (
    url
      .toLowerCase()
      .startsWith("https://")
  ) {

    return url;

  }

  return url;

}


/* ==========================================
   تحميل M3U
========================================== */

async function loadM3U() {

  try {

    const response =
      await fetch(
        CONFIG.M3U_URL,
        {
          cache:
            "no-store"
        }
      );

    if (!response.ok) {

      throw new Error(
        "M3U HTTP " +
        response.status
      );

    }

    const text =
      await response.text();

    const parsed =
      parseM3U(text);

    allChannels =
      allChannels.concat(
        parsed
      );

  } catch (error) {

    console.error(
      "M3U error:",
      error
    );

  }

}


/* ==========================================
   Parse M3U
========================================== */

function parseM3U(text) {

  const lines =
    text
      .split(/\r?\n/)
      .map(
        x => x.trim()
      )
      .filter(Boolean);

  const result = [];

  let info = null;

  for (
    let i = 0;
    i < lines.length;
    i++
  ) {

    const line =
      lines[i];

    if (
      line.startsWith(
        "#EXTINF:"
      )
    ) {

      info = line;

      continue;

    }

    if (
      !line.startsWith("#") &&
      info
    ) {

      const url =
        line;

      const name =
        getAttribute(
          info,
          "tvg-name"
        ) ||
        getName(info) ||
        "قناة";

      const logo =
        getAttribute(
          info,
          "tvg-logo"
        ) ||
        "";

      result.push({

        name,

        logo,

        url,

        type:
          "m3u"

      });

      info = null;

    }

  }

  return result;

}


/* ==========================================
   اسم القناة
========================================== */

function getName(line) {

  const comma =
    line.indexOf(",");

  if (
    comma === -1
  ) {

    return "قناة";

  }

  return line
    .substring(
      comma + 1
    )
    .trim();

}


/* ==========================================
   Attribute
========================================== */

function getAttribute(
  line,
  attribute
) {

  const regex =
    new RegExp(
      attribute +
      '="([^"]*)"',
      "i"
    );

  const match =
    line.match(
      regex
    );

  return match
    ? match[1]
    : "";

}


/* ==========================================
   قنوات ألوان
========================================== */

function addAlwanChannels() {

  for (
    let i = 1;
    i <= CONFIG.ALWAN_COUNT;
    i++
  ) {

    allChannels.push({

      name:
        "ألوان " + i,

      logo:
        "",

      url:
        CONFIG.ALWAN_BASE +
        i +
        ".m3u8",

      type:
        "alwan"

    });

  }

}


/* ==========================================
   رسم القنوات
========================================== */

function renderChannels(
  channels
) {

  channelsEl.innerHTML =
    "";

  channelCountEl.textContent =
    channels.length +
    " قناة";

  if (
    !channels.length
  ) {

    channelsEl.innerHTML =
      `
      <div class="empty">
        لا توجد قنوات.
      </div>
      `;

    return;

  }

  channels.forEach(
    (
      channel,
      index
    ) => {

      const card =
        document.createElement(
          "article"
        );

      card.className =
        "channel";

      const logo =
        channel.logo
          ? `
            <img
              class="channel-logo"
              src="${escapeHTML(channel.logo)}"
              loading="lazy"
              onerror="
                this.style.display='none'
              "
            >
          `
          : `
            <div
              class="channel-logo"
              style="
                display:flex;
                align-items:center;
                justify-content:center;
                font-size:25px;
                opacity:.5
              "
            >
              TV
            </div>
          `;

      card.innerHTML = `

        <span class="channel-number">
          ${index + 1}
        </span>

        ${logo}

        <div class="channel-name">
          ${escapeHTML(
            channel.name
          )}
        </div>

        <div class="status live">
          ● متاحة للمشاهدة
        </div>

      `;

      card.addEventListener(
        "click",
        () => {

          openChannel(
            channel
          );

        }
      );

      channelsEl.appendChild(
        card
      );

    }
  );

}


/* ==========================================
   تشغيل القناة
========================================== */

async function openChannel(
  channel
) {

  currentChannel =
    channel;

  playerEl.classList.add(
    "active"
  );

  playerTitle.textContent =
    channel.name;

  playerError.classList.remove(
    "show"
  );

  spinner.classList.add(
    "show"
  );

  try {

    await player.unload();

    const stream =
      proxyUrl(
        channel.url
      );

    console.log(
      "[PLAYER]",
      channel.name
    );

    console.log(
      "[URL]",
      stream
    );

    await player.load(
      stream
    );

    try {

      await video.play();

    } catch (
      autoplayError
    ) {

      console.warn(
        "Autoplay blocked",
        autoplayError
      );

    }

    spinner.classList.remove(
      "show"
    );

  } catch (
    error
  ) {

    console.error(
      "[PLAYBACK ERROR]",
      error
    );

    spinner.classList.remove(
      "show"
    );

    showPlayerError(
      error
    );

  }

}


/* ==========================================
   عرض الخطأ
========================================== */

function showPlayerError(
  error
) {

  let message =
    "تعذر تشغيل القناة.";

  if (
    error &&
    error.code
  ) {

    message +=
      " رمز الخطأ: " +
      error.code;

  }

  if (
    error &&
    error.message
  ) {

    console.error(
      error.message
    );

  }

  errorText.textContent =
    message;

  playerError.classList.add(
    "show"
  );

}


/* ==========================================
   Retry
========================================== */

document
  .getElementById(
    "retry"
  )
  .addEventListener(
    "click",
    () => {

      if (
        currentChannel
      ) {

        openChannel(
          currentChannel
        );

      }

    }
  );


/* ==========================================
   إغلاق
========================================== */

document
  .getElementById(
    "closePlayer"
  )
  .addEventListener(
    "click",
    async () => {

      try {

        await player.unload();

      } catch {}

      video.pause();

      playerEl.classList.remove(
        "active"
      );

    }
  );


/* ==========================================
   البحث
========================================== */

searchEl.addEventListener(
  "input",
  () => {

    const query =
      searchEl.value
        .trim()
        .toLowerCase();

    if (!query) {

      renderChannels(
        allChannels
      );

      return;

    }

    const filtered =
      allChannels.filter(
        channel =>
          channel.name
            .toLowerCase()
            .includes(
              query
            )
      );

    renderChannels(
      filtered
    );

  }
);


/* ==========================================
   حماية HTML
========================================== */

function escapeHTML(
  value
) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* ==========================================
   أخطاء Shaka
========================================== */

player.addEventListener(
  "error",
  event => {

    console.error(
      "SHAKA ERROR:",
      event.detail
    );

  }
);


/* ==========================================
   Buffering
========================================== */

player.addEventListener(
  "buffering",
  event => {

    if (
      event.buffering
    ) {

      spinner.classList.add(
        "show"
      );

    } else {

      spinner.classList.remove(
        "show"
      );

    }

  }
);


/* ==========================================
   بدء الموقع
========================================== */

async function init() {

  try {

    await loadM3U();

  } catch (
    error
  ) {

    console.error(
      error
    );

  }

  addAlwanChannels();

  renderChannels(
    allChannels
  );

}


init();

</script>

</body>
</html>
