<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>السوبر ليغ - Super League</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        /* المتغيرات اللونية والهوية البصرية المستقبلية (Futuristic) */
        :root {
            --bg-dark: #05070a;
            --surface-color: rgba(15, 18, 25, 0.7);
            --surface-hover: rgba(22, 27, 38, 0.9);
            --primary-glow: #00f0ff;
            --primary-dark: #0088ff;
            --admin-gold: #ffd700;
            --admin-gold-glow: rgba(255, 215, 0, 0.4);
            --text-main: #f0f4f8;
            --text-muted: #7284a1;
            --danger: #ff2a5f;
            --success: #00ff88;
            --border-light: rgba(255, 255, 255, 0.05);
            --card-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
            --neon-box-shadow: 0 0 15px rgba(0, 240, 255, 0.15), inset 0 0 20px rgba(0, 240, 255, 0.05);
        }

        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 240, 255, 0.03), transparent 30%),
                radial-gradient(circle at 90% 80%, rgba(0, 136, 255, 0.03), transparent 30%),
                linear-gradient(rgba(255, 255, 255, 0.01) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.01) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 60px;
            overflow-x: hidden;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: rgba(0, 240, 255, 0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary-glow); }

        /* Premium Glass Panels */
        .glass-panel {
            background: var(--surface-color);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-light);
            border-left: 2px solid rgba(0, 240, 255, 0.2);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: var(--card-shadow);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        /* Login Screen */
        #login-screen {
            padding: 60px 20px;
            max-width: 1100px;
            margin: auto;
            text-align: center;
            animation: fadeIn 0.8s ease;
        }
        
        .main-title {
            font-size: 3.5rem;
            font-weight: 900;
            background: linear-gradient(to right, #fff, var(--primary-glow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 40px rgba(0, 240, 255, 0.3);
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
            margin-top: 50px;
        }

        .player-card {
            background: rgba(12, 15, 22, 0.8);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 25px 15px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .player-card::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary-glow));
            transition: 0.4s;
        }

        .player-card:hover {
            transform: translateY(-8px);
            border-color: rgba(0, 240, 255, 0.3);
            background: rgba(18, 22, 33, 0.9);
            box-shadow: 0 15px 30px -10px rgba(0, 240, 255, 0.15);
        }
        
        .player-card:hover::before { left: 0; }

        .player-logo {
            width: 70px;
            height: 70px;
            object-fit: contain;
            margin-bottom: 20px;
            filter: grayscale(20%) drop-shadow(0 4px 10px rgba(0,0,0,0.6));
            transition: 0.4s ease;
        }

        .player-card:hover .player-logo { 
            transform: scale(1.1); 
            filter: grayscale(0%) drop-shadow(0 8px 15px rgba(0, 240, 255, 0.3)); 
        }

        .player-card .name { font-weight: 800; font-size: 1.1rem; margin-bottom: 4px; letter-spacing: 0.5px; }
        .player-card .club { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; }

        .admin-badge {
            background: rgba(255, 215, 0, 0.05);
            color: var(--admin-gold);
            border: 1px solid rgba(255, 215, 0, 0.3);
            font-size: 0.7rem;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 4px;
            margin-top: 15px;
            display: inline-block;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Top Navigation */
        .top-nav {
            background: rgba(5, 7, 10, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .brand-text {
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--primary-glow);
            letter-spacing: 2px;
            margin-left: 20px;
            border-left: 1px solid var(--border-light);
            padding-left: 20px;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-profile img {
            width: 45px;
            height: 45px;
            object-fit: contain;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5));
        }

        .logout-btn {
            background: transparent;
            border: 1px solid rgba(255,42,95,0.3);
            color: var(--danger);
            padding: 8px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.8rem;
            letter-spacing: 1px;
            transition: 0.3s;
        }
        
        .logout-btn:hover {
            background: rgba(255, 42, 95, 0.1);
            box-shadow: 0 0 15px rgba(255, 42, 95, 0.2);
        }

        /* Modern Tabs */
        .tabs-container {
            display: flex;
            gap: 15px;
            padding: 30px 20px;
            max-width: 1200px;
            margin: auto;
            overflow-x: auto;
        }

        .tab-btn {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid transparent;
            border-bottom: 2px solid var(--border-light);
            padding: 12px 25px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            white-space: nowrap;
            letter-spacing: 1px;
            position: relative;
        }

        .tab-btn:hover { color: #fff; }

        .tab-btn.active {
            color: var(--primary-glow);
            border-bottom: 2px solid var(--primary-glow);
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -2px; left: 50%;
            transform: translateX(-50%);
            width: 30%; height: 2px;
            background: #fff;
            box-shadow: 0 0 10px #fff;
        }

        /* View Sections & Animations */
        .view-section {
            display: none;
            max-width: 1200px;
            margin: auto;
            padding: 0 20px;
        }

        .view-section.active {
            display: block;
            animation: slideUp 0.5s cubic-bezier(0.165, 0.84, 0.44, 1) forwards;
        }

        /* Ultra Modern Table */
        .table-responsive { overflow-x: auto; }
        
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 6px;
            text-align: center;
        }

        th {
            color: var(--text-muted);
            padding: 12px 15px;
            font-weight: 700;
            font-size: 0.8rem;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        tbody tr {
            background: rgba(15, 18, 25, 0.5);
            transition: 0.3s;
        }

        tbody tr:hover {
            background: rgba(22, 27, 38, 0.8);
            transform: scale(1.005);
        }

        td {
            padding: 15px;
            font-weight: 600;
            font-size: 0.95rem;
            border-top: 1px solid transparent;
            border-bottom: 1px solid transparent;
        }

        tbody tr td:first-child { border-right: 2px solid transparent; }
        tbody tr:hover td:first-child { border-right: 2px solid var(--primary-glow); }

        .team-info {
            display: flex;
            align-items: center;
            gap: 15px;
            text-align: right;
        }

        .team-info img {
            width: 35px;
            height: 35px;
            object-fit: contain;
        }

        .pts-col {
            color: #fff;
            font-weight: 900;
            font-size: 1.2rem;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .status-badge {
            padding: 5px 12px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .badge-qual { background: rgba(0, 240, 255, 0.05); color: var(--primary-glow); border: 1px solid rgba(0,240,255,0.2); }
        .badge-out { background: rgba(255, 42, 95, 0.05); color: var(--danger); border: 1px solid rgba(255,42,95,0.2); }

        .qualified-boundary td { border-bottom: 1px solid rgba(0, 240, 255, 0.2); }

        /* Match Cards - E-Sports Style */
        .section-title {
            color: #fff;
            font-weight: 900;
            font-size: 1.5rem;
            margin-bottom: 25px;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .section-title::before {
            content: '';
            display: block;
            width: 4px; height: 20px;
            background: var(--primary-glow);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        .match-card {
            background: rgba(12, 15, 22, 0.6);
            border: 1px solid rgba(255,255,255,0.03);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            transition: 0.3s;
            position: relative;
        }
        
        .match-card:hover { 
            background: rgba(18, 22, 33, 0.8);
            border-color: rgba(0, 240, 255, 0.15); 
        }

        .match-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.02);
        }

        .match-meta .round {
            color: var(--primary-glow); font-weight: 800; font-size: 0.8rem; letter-spacing: 1px;
        }
        .match-meta .stadium { color: var(--text-muted); font-size: 0.75rem; font-weight: 600; letter-spacing: 1px; }

        .teams-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .team {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 30%;
            gap: 10px;
            font-size: 0.9rem;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .team img {
            width: 55px;
            height: 55px;
            object-fit: contain;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.8));
        }

        .score-area {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40%;
        }

        .score-box {
            background: transparent;
            font-size: 2rem;
            font-weight: 900;
            color: #fff;
            letter-spacing: 5px;
            text-shadow: 0 0 20px rgba(255,255,255,0.3);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .score-box.pending {
            font-size: 0.85rem;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-shadow: none;
            text-transform: uppercase;
        }

        /* Admin Controls */
        .score-input {
            width: 60px;
            height: 55px;
            text-align: center;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--primary-glow);
            font-size: 1.5rem;
            font-weight: 900;
            border-radius: 4px;
            transition: 0.3s;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .score-input:focus {
            outline: none;
            border-color: var(--primary-glow);
            box-shadow: inset 0 0 10px rgba(0, 240, 255, 0.2);
            background: rgba(0,0,0,0.8);
        }

        .vs-badge {
            color: var(--text-muted);
            font-weight: 900;
            font-size: 0.8rem;
            margin: 0 15px;
            letter-spacing: 1px;
        }

        select.modern-select {
            width: 100%;
            padding: 15px;
            background: rgba(10, 12, 18, 0.8);
            color: #fff;
            border: 1px solid var(--border-light);
            border-radius: 6px;
            margin-bottom: 25px;
            font-size: 0.95rem;
            font-weight: 700;
            outline: none;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 1px;
            appearance: none;
        }
        
        select.modern-select:focus { border-color: var(--primary-glow); box-shadow: 0 0 15px rgba(0, 240, 255, 0.1); }

        .btn-primary {
            background: transparent;
            color: var(--primary-glow);
            border: 1px solid var(--primary-glow);
            padding: 15px 30px;
            border-radius: 4px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
            box-shadow: var(--neon-box-shadow);
        }
        
        .btn-primary:hover {
            background: var(--primary-glow);
            color: #000;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.5);
        }

        .system-status {
            position: fixed;
            bottom: 20px;
            left: 20px; /* Moved to left for better balance */
            background: rgba(5, 7, 10, 0.8);
            border: 1px solid rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            padding: 8px 15px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 1000;
            letter-spacing: 1px;
        }

        .status-dot { width: 6px; height: 6px; border-radius: 50%; }
        .dot-live { background: var(--success); box-shadow: 0 0 10px var(--success); animation: pulse 2s infinite; }
        .dot-local { background: var(--admin-gold); box-shadow: 0 0 10px var(--admin-gold); }

        /* Keyframes */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { 
            from { opacity: 0; transform: translateY(15px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 255, 136, 0.4); }
            70% { box-shadow: 0 0 0 6px rgba(0, 255, 136, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 255, 136, 0); }
        }
    </style>
</head>

                    </div>
                </div>
                <div class="brand-text">السوبر ليغ</div>
            </div>
            <button onclick="logout()" class="logout-btn">تسجيل الخروج</button>

        <div class="tabs-container">
            <button class="tab-btn active" onclick="switchTab('standings', this)">الترتيب العام</button>
            <button class="tab-btn" onclick="switchTab('my-matches', this)">مبارياتي</button>

        <div id="standings-section" class="view-section active">

                    </thead>
                    <tbody id="standings-body">
                        </tbody>
                </table>
            </div>
        </div>

        <div id="my-matches-section" class="view-section">
            <h2 class="section-title">جدول مبارياتك</h2>
            <div id="my-matches-container"></div>
        </div>

        <div id="admin-section" class="view-section">
            <div id="draw-section" style="margin-bottom: 25px;"></div>
            
            <div class="glass-panel">
                <h2 class="section-title">إدخال النتائج</h2>
                <select id="round-select" class="modern-select" onchange="loadAdminRound()"></select>
                
                <div id="admin-matches-container" style="display:flex; flex-direction:column; gap:15px; margin-bottom:25px;"></div>
                
                <button id="save-btn" class="btn-primary" onclick="saveRoundResults()">حفظ وتحديث النتائج المباشرة</button>
            </div>
        </div>

    </div>

            { id: 13, name: "أيمن صالح", club: "باريس سان جيرمان", logo: "https://upload.wikimedia.org/wikipedia/en/a/a7/Paris_Saint-Germain_F.C..svg", isAdmin: false },
            { id: 14, name: "همام احمد", club: "ليفربول", logo: "https://upload.wikimedia.org/wikipedia/en/0/0c/Liverpool_FC.svg", isAdmin: false },
            { id: 15, name: "محمد طه", club: "روما", logo: "https://upload.wikimedia.org/wikipedia/en/f/f7/AS_Roma_logo_%282017%29.svg", isAdmin: false },
            { id: 16, name: "خطاب احمد", club: "كومو", logo: "https://i.supaimg.com/4d83dc19-3e52-40fd-ba22-d0e725844112/3f302b65-1266-4b34-8007-3ed20dabf39e.png", isAdmin: false }
        ];

        let state = { currentUser: null, teamsStats: [], fixtures: [], drawDone: false };
        let isOnline = false;
        let db = null;

        if (firebaseConfig.apiKey) {
            try {
                firebase.initializeApp(firebaseConfig);
                db = firebase.database();
                isOnline = true;
            } catch (e) {
                console.error("Firebase Init Error:", e);
            }
        }

        const SyncEngine = {
            save: function() {
                const data = { teamsStats: state.teamsStats, fixtures: state.fixtures, drawDone: state.drawDone };
                if (isOnline) db.ref('superleague_live').set(data);
                else { localStorage.setItem('sl_db', JSON.stringify(data)); refreshUI(data); }
            },
            listen: function() {
                if (isOnline) {
                    db.ref('superleague_live').on('value', snap => refreshUI(snap.val()));
                } else {
                    const local = JSON.parse(localStorage.getItem('sl_db'));
                    refreshUI(local);
                }
            }
        };

        function init() {
            document.getElementById('players-grid').innerHTML = officialPlayers.map(p => `
                <div class="player-card" onclick="login(${p.id})">
                    <img src="${p.logo}" class="player-logo" loading="lazy">
                    <div class="name">${p.name}</div>
                    <div class="club">${p.club}</div>
                    ${p.isAdmin ? '<div class="admin-badge">المنظم المعتمد</div>' : ''}
                </div>
            `).join('');

            const statusDiv = document.createElement('div');
            statusDiv.className = 'system-status';
            statusDiv.innerHTML = isOnline 
                ? '<div class="status-dot dot-live"></div> متصل بالخوادم' 
                : '<div class="status-dot dot-local"></div> اتصال محلي';
            document.body.appendChild(statusDiv);

            SyncEngine.listen();

            const saved = localStorage.getItem('sl_logged_user');
            if (saved) login(parseInt(saved), true);
        }

        function refreshUI(data) {
            if (data) {
                state.teamsStats = data.teamsStats || [];
                state.fixtures = data.fixtures || [];
                state.drawDone = data.drawDone || false;
            } else {
                state.teamsStats = officialPlayers.map(p => ({ id: p.id, p:0, w:0, d:0, l:0, gf:0, ga:0, gd:0, pts:0 }));
                state.fixtures = [];
                state.drawDone = false;
                if (!isOnline) SyncEngine.save();
            }

            if (state.currentUser) {
                if (state.currentUser.isAdmin) setupAdmin();
                renderMyMatches();
            }
            calcStats();
        }

        function login(id, isAuto = false) {
            const user = officialPlayers.find(p => p.id === id);
            if (!user) return;

            if (user.isAdmin && !isAuto) {
                const pass = prompt("الرمز الأمني للمنظم:");
                if (pass !== "09128734") { alert("رفض الوصول: رمز غير صالح"); return; }
            }

            state.currentUser = user;
            localStorage.setItem('sl_logged_user', id);
            
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            document.getElementById('nav-logo').src = user.logo;
            document.getElementById('nav-name').innerText = user.name;
            document.getElementById('nav-club').innerText = user.club;

            if (user.isAdmin) {
                document.getElementById('admin-tab').style.display = 'block';
                setupAdmin();
            } else {
                document.getElementById('admin-tab').style.display = 'none';
            }
            
            refreshUI({ teamsStats: state.teamsStats, fixtures: state.fixtures, drawDone: state.drawDone });
        }

        function logout() {
            localStorage.removeItem('sl_logged_user');
            location.reload();
        }

        function switchTab(id, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(id + '-section').classList.add('active');
        }

        function officialDraw() {
            if (state.drawDone) return;
            state.fixtures = [];
            state.teamsStats = officialPlayers.map(p => ({ id: p.id, p:0, w:0, d:0, l:0, gf:0, ga:0, gd:0, pts:0 }));
            
            let tIds = officialPlayers.map(p => p.id);
            let n = tIds.length;
            let mId = 1;

            for (let r = 0; r < 8; r++) {
                for (let i = 0; i < n/2; i++) {
                    let home = tIds[i], away = tIds[n - 1 - i];
                    state.fixtures.push({ id: mId++, round: r+1, homeId: home, awayId: away, homeScore: "", awayScore: "" });
                }
                tIds.splice(1, 0, tIds.pop());
            }
            state.drawDone = true;
            SyncEngine.save(); 
            alert('تم إجراء القرعة وتوليد الجداول بنجاح.');
        }

        function calcStats() {
            state.teamsStats.forEach(t => { t.p=0; t.w=0; t.d=0; t.l=0; t.gf=0; t.ga=0; t.gd=0; t.pts=0; });

            if (!state.drawDone) { renderTable(); return; }

            state.fixtures.forEach(m => {
                if (typeof m.homeScore === 'number' && typeof m.awayScore === 'number') {
                    let h = state.teamsStats.find(t => t.id === m.homeId);
                    let a = state.teamsStats.find(t => t.id === m.awayId);
                    
                    if (h && a) {
                        h.p++; a.p++; h.gf += m.homeScore; a.gf += m.awayScore;
                        h.ga += m.awayScore; a.ga += m.homeScore;

                        if (m.homeScore > m.awayScore) { h.w++; h.pts+=3; a.l++; }
                        else if (m.homeScore < m.awayScore) { a.w++; a.pts+=3; h.l++; }
                        else { h.d++; a.d++; h.pts+=1; a.pts+=1; }
                    }
                }
            });

            state.teamsStats.forEach(t => { t.gd = t.gf - t.ga; });
            
            state.teamsStats.sort((a, b) => {
                if (b.pts !== a.pts) return b.pts - a.pts;
                if (b.gd !== a.gd) return b.gd - a.gd; 
                if (b.gf !== a.gf) return b.gf - a.gf;
                if (a.ga !== b.ga) return a.ga - b.ga;
                return 0;
            });
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('standings-body');
            if (!state.drawDone) {
                tbody.innerHTML = `<tr><td colspan="11" style="padding:40px; color:var(--text-muted); font-size:0.9rem; letter-spacing:1px;">بانتظار التهيئة...</td></tr>`;
                return;
            }

            let html = '';
            state.teamsStats.forEach((t, i) => {
                const p = officialPlayers.find(x => x.id === t.id);
                if (!p) return;
                const isMe = state.currentUser && state.currentUser.id === p.id;
                const r = i + 1;
                const badge = r <= 8 ? '<span class="status-badge badge-qual">تأهل</span>' : '<span class="status-badge badge-out">إقصاء</span>';
                const rowClass = r === 8 ? 'qualified-boundary' : '';
                const bg = isMe ? 'background: rgba(0, 240, 255, 0.05);' : '';

                html += `
                <tr class="${rowClass}" style="${bg}">
                    <td style="color:${r<=4 ? 'var(--admin-gold)' : 'var(--text-muted)'}; font-weight:900; font-size:1.1rem; font-family:'Segoe UI', sans-serif;">${r}</td>
                    <td>
                        <div class="team-info">
                            <img src="${p.logo}" loading="lazy">
                            <div>
                                <div style="${isMe ? 'color:var(--primary-glow); font-weight:900;' : 'font-weight:800; color:#fff;'}">${p.name}</div>
                                <div style="font-size:0.75rem; color:var(--text-muted); font-weight:700; letter-spacing:0.5px;">${p.club}</div>
                            </div>
                        </div>
                    </td>
                    <td style="color:var(--text-muted);">${t.p}</td>
                    <td>${t.w}</td>
                    <td>${t.d}</td>
                    <td>${t.l}</td>
                    <td style="color:var(--success)">${t.gf}</td>
                    <td style="color:var(--danger)">${t.ga}</td>
                    <td style="direction:ltr; font-weight:900; font-family:'Segoe UI', sans-serif; color:${t.gd > 0 ? 'var(--primary-glow)' : t.gd < 0 ? 'var(--danger)' : 'inherit'}">${t.gd > 0 ? '+'+t.gd : t.gd}</td>
                    <td class="pts-col" style="font-family:'Segoe UI', sans-serif;">${t.pts}</td>
                    <td>${badge}</td>
                </tr>`;
            });
            tbody.innerHTML = html;
        }

        function renderMyMatches() {
            const cont = document.getElementById('my-matches-container');
            if (!state.drawDone) {
                cont.innerHTML = `<div class="glass-panel" style="text-align:center; font-size:0.9rem; color:var(--text-muted); letter-spacing:1px;">لا توجد بيانات متاحة حالياً.</div>`;
                return;
            }

            const matches = state.fixtures.filter(m => m.homeId === state.currentUser.id || m.awayId === state.currentUser.id);
            let html = '';
            
            matches.forEach(m => {
                const isH = m.homeId === state.currentUser.id;
                const opp = officialPlayers.find(p => p.id === (isH ? m.awayId : m.homeId));
                let ms = isH ? m.homeScore : m.awayScore;
                let os = isH ? m.awayScore : m.homeScore;
                
                let scoreHtml = (typeof ms === 'number' && typeof os === 'number') 
                    ? `<div class="score-box">${ms} - ${os}</div>` 
                    : `<div class="score-box pending">لم تُلعب</div>`;

                html += `
                <div class="match-card">
                    <div class="match-meta">
                        <span class="round">الجولة ${m.round}</span>
                        <span class="stadium">ملعب محايد</span> 
                    </div>
                    <div class="teams-row">
                        <div class="team">
                            <img src="${state.currentUser.logo}">
                            <span style="color:var(--primary-glow)">أنت</span>
                        </div>
                        <div class="score-area">${scoreHtml}</div>
                        <div class="team">
                            <img src="${opp.logo}">
                            <span style="color:#fff;">${opp.name}</span>
                        </div>
                    </div>
                </div>`;
            });
            cont.innerHTML = html;
        }

        function setupAdmin() {
            const sel = document.getElementById('round-select');
            if (sel.innerHTML === '') {
                for(let i=1; i<=8; i++) sel.innerHTML += `<option value="${i}">نتائج الجولة ${i}</option>`;
            }
            
            const drawSec = document.getElementById('draw-section');
            if (!state.drawDone) {
                drawSec.innerHTML = `<button class="btn-primary" onclick="officialDraw()">إجراء القرعة الرسمية</button>`;
                drawSec.style.display = 'block';
            } else {
                drawSec.style.display = 'none';
            }
            loadAdminRound();
        }

        function loadAdminRound() {
            const cont = document.getElementById('admin-matches-container');
            if (!state.drawDone) { cont.innerHTML = ''; return; }

            const r = parseInt(document.getElementById('round-select').value);
            const matches = state.fixtures.filter(m => m.round === r);
            let html = '';
            
            matches.forEach(m => {
                const h = officialPlayers.find(p => p.id === m.homeId);
                const a = officialPlayers.find(p => p.id === m.awayId);
                const hVal = typeof m.homeScore === 'number' ? m.homeScore : '';
                const aVal = typeof m.awayScore === 'number' ? m.awayScore : '';

                html += `
                <div class="match-card" data-id="${m.id}">
                    <div class="teams-row">
                        <div class="team" style="width:35%;"><img src="${h.logo}" style="width:40px;height:40px;"><span>${h.name}</span></div>
                        <div class="score-area" style="width:30%;">
                            <input type="number" class="h-in score-input" min="0" value="${hVal}">
                            <span class="vs-badge">VS</span>
                            <input type="number" class="a-in score-input" min="0" value="${aVal}">
                        </div>
                        <div class="team" style="width:35%;"><img src="${a.logo}" style="width:40px;height:40px;"><span>${a.name}</span></div>
                    </div>
                </div>`;
            });
            cont.innerHTML = html;
        }

        function saveRoundResults() {
            if (!state.drawDone) return;

            document.querySelectorAll('#admin-matches-container .match-card').forEach(c => {
                const id = parseInt(c.getAttribute('data-id'));
                const hVal = c.querySelector('.h-in').value;
                const aVal = c.querySelector('.a-in').value;
                
                let m = state.fixtures.find(x => x.id === id);
                if (m) {
                    if (hVal !== '' && aVal !== '') {
                        m.homeScore = parseInt(hVal); 
                        m.awayScore = parseInt(aVal);
                    } else {
                        m.homeScore = ""; 
                        m.awayScore = "";
                    }
                }
            });

            SyncEngine.save(); 
            
            const btn = document.getElementById('save-btn');
            const txt = btn.innerText;
            btn.innerText = "تم الحفظ بنجاح";
            btn.style.background = "var(--success)";
            btn.style.color = "#000";
            btn.style.borderColor = "var(--success)";
            btn.style.boxShadow = "0 0 25px rgba(0, 255, 136, 0.4)";
            
            setTimeout(() => { 
                btn.innerText = txt; 
                btn.style.background = ""; 
                btn.style.color = "";
                btn.style.borderColor = "";
                btn.style.boxShadow = ""; 
            }, 2500);
        }

        window.onload = init;
    </script>
</body>
</html>
